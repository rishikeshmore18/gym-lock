:root{--page:#FAF9F6;--card:#fff;--text:#1A1A1A;--sub:#6B6B6B;--seg:#EDECE8;--segsel:#fff;--line:#E8E8E8;color-scheme:light}
:root[data-theme=dark]{--page:#0B0B0C;--card:#151517;--text:#F2F2F0;--sub:#A3A3A3;--seg:#1F1F22;--segsel:#3A3A3F;--line:rgba(255,255,255,.08);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.panel{margin-top:26px;padding:16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.ptitle{font:700 12px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:2px}
.seg button,.chip{font:600 14px/1.15 -apple-system,system-ui,sans-serif;border:0;color:var(--text);background:none;border-radius:8px;padding:9px 12px;cursor:pointer}
.seg button.sel{background:var(--segsel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{background:var(--seg);border-radius:10px}
.chip.primary{background:var(--text);color:var(--card)}
.chip.sel{background:var(--text);color:var(--card)}

lex;align-items:center;justify-content:center;transition:opacity .25s linear}\n#mu.day #chips{opacity:0;pointer-events:none}\n#rp{position:absolute;left:0;right:0;top:0;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .34s var(--ease),transform .4s var(--ease)}\n#mu.day #rp{opacity:1;pointer-events:auto;transform:none}\n#rp:before{content:\"\";position:absolute;left:50%;top:calc(var(--rh)*1.6 + 34px);width:calc(var(--rw)*2 + var(--rf)*.5 + var(--rf2)*2 + 22px);height:var(--rh);margin-top:calc(var(--rh)/-2);transform:translateX(-50%);border-radius:20px;background:rgba(255,255,255,.07)}\n.rr{margin-top:34px;position:relative;display:flex;justify-content:center;align-items:center;gap:0}\n.rr .reel{width:var(--rw)}\n.rr .reel.ap{width:calc(var(--rf2)*2.1);margin-left:8px}\n.rr .colon{width:calc(var(--rf)*.34);text-align:center}\n#rh .rw{justify-content:flex-end}#rm .rw{justify-content:flex-start}\n.rr .reel:not(.ap){width:calc(var(--rw)*.98)}\n#note{position:absolute;left:0;right:0;bottom:0}\n#bot{position:relative;height:56px;margin:14px 28px 0}\n#pl,#cm{position:absolute;inset:0;display:flex;gap:10px;transition:opacity .26s linear,transform .3s var(--ease)}\n#cm{opacity:0;pointer-events:none;transform:translateY(10px)}\n#cm .cta{flex:1}\n#mu.day #pl{opacity:0;pointer-events:none;transform:translateY(-10px)}\n#mu.day #cm{opacity:1;pointer-events:auto;transform:none}\n/* confirm */\n#mu.cf #muH,#mu.cf #anc,#mu.cf #cap,#mu.cf #mid,#mu.cf #bot{opacity:0!important;pointer-events:none;transition:opacity .22s linear}\n#mu.cf .col:not(.sel){opacity:0;transition:opacity .22s linear}\n#mu.cf .col.sel .fl{visibility:hidden}\n#mu.cf .col.sel .lb{opacity:0}\n#cf{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;padding-bottom:30px}\n#cf .cff{width:116px;height:136px;position:relative}\n#cf .cff .fl{width:116px;height:136px}\n#cf .cff .ff{filter:drop-shadow(0 10px 30px rgba(255,115,0,.6))}\n#cf .cfd{font-size:20px;font-weight:700;color:rgba(255,255,255,.78);margin-top:6px;letter-spacing:.01em}\n#cf .cft{display:flex;align-items:baseline;gap:8px;font-family:var(--rnd);font-weight:800;color:#F5F5F5}\n#cf .cft b{font-size:84px;line-height:.95;letter-spacing:-.03em;font-weight:800}\n#cf .cft i{font-style:normal;font-size:32px}\n#cf .cfs{font-family:var(--rnd);font-weight:800;font-size:52px;letter-spacing:-.02em;color:#F5F5F5;margin-top:4px}\n#cf .cfn{font-size:15px;font-weight:600;color:rgba(255,255,255,.6)}\n#cf .cfi{color:#F5F5F5}\n#cf .cfu .fo path{stroke:rgba(255,255,255,.55)}\n#cf .hid{opacity:0}\n@media (max-height:700px){\n  #anc .num{font-size:46px}#anc .unit{font-size:13px}\n  .col{width:44px;height:72px;padding-top:12px}\n  .col .lb{margin-top:6px}\n  #cf .cff,#cf .cff .fl{width:92px;height:108px}\n  #cf .cft b{font-size:68px}#cf .cfs{font-size:44px}\n}\n\n#dh{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:baseline;justify-content:center;gap:12px}\n#dh b{font-family:var(--rnd);font-weight:800;font-size:24px;letter-spacing:-.01em;color:#F5F5F5;line-height:30px}\n#dh button{font-size:13px;font-weight:600;color:rgba(255,255,255,.6);padding:8px 6px;margin:-8px 0}\n#dh button:active{color:#fff}\n<\/style><\/head>\n<body>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs><linearGradient id=\"fg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#D82713\"/><stop offset=\".5\" stop-color=\"#FF7300\"/><stop offset=\"1\" stop-color=\"#FFC42E\"/><\/linearGradient><\/defs><\/svg>\n<div id=\"app\">\n  <div id=\"media\"><div id=\"kb\"><div class=\"blob\" id=\"b1\"><\/div><div class=\"blob\" id=\"b2\"><\/div><div id=\"horizon\"><\/div><\/div><div id=\"vig\"><\/div><div id=\"shade\"><\/div><div id=\"label\"><\/div><\/div>\n  <div id=\"prog\"><div id=\"fill\"><\/div><\/div>\n  <div id=\"meta\"><\/div>\n  <div id=\"stage\"><\/div>\n  <div id=\"fine\">close to keep going. no wait.<\/div>\n  <button id=\"timer\" aria-label=\"continue, after 30 seconds\"><span id=\"tfill\"><\/span><span id=\"tlab\">0:30<\/span><\/button>\n  <div id=\"mu\"><\/div>\n  <div id=\"end\"><\/div>\n  <button id=\"snd\" aria-label=\"sound\"><i><\/i><\/button>\n  <button id=\"x\" aria-label=\"close, keep going\"><i><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M2 2l10 10M12 2L2 12\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg><\/i><\/button>\n<\/div>\n<script>/* GymLock \u00b7 \"plans changed\" pause \u00b7 shared engine for all 4 variants.\n   Owns: demo scenario, the copy (lines + choices), reading pace, the 30 s clock, demo haptic log.\n   Variants own only the look and motion. Do not edit this file from a variant. */\n(function () {\n  const WAIT = 30;\n\n  /* ---------------- scenario (stands in for real app data) ---------------- */\n  const DEFAULT = {\n    ctx: 'wake',          // 'wake' just woke (window open) | 'trip' on the way | 'closed' window ran out\n    visits: 23,           // gym visits so far (GymVisitTracker); day N of 66 counts these\n    lastMissed: false,    // last planned session was skipped\n    weekDone: 1, weekGoal: 3, plannedLeft: 3, // plannedLeft includes today (SkipRules.chancesRemaining)\n    reason: 'laterToday', // OnboardingProfile.failureReasons first pick, or 'none'\n    gymBy: '7:05', now: '6:41', etaMin: 12, graceMin: 10,\n    homeLeft: 2, homeMin: 25,\n    day0: 'video',        // Day0Media kind: 'video' | 'photo' | 'none'\n    day0Date: 'sep 12',\n    streakWeeks: 6,       // week streak (StreakChip number)\n    alarmAt: '6:30', date: 'tue nov 24'\n  };\n  let cfg = Object.assign({}, DEFAULT);\n\n  /* ---------------- reading pace ----------------\n     Adults read about 238 words a minute silently (Brysbaert, 2019). Just after waking, sleep inertia\n     slows thinking (Hilditch, 2019), so we pace for 150 wpm = 2.5 words a second, plus time to notice\n     the line and a dwell before the next one. */\n  const WPS = 2.5, NOTICE = 0.5, DWELL = 1.1, MIN_LINE = 2.4, START = 0.7;\n  const words = s => s.trim().split(/\\s+/).length;\n  const lineDuration = s => Math.max(MIN_LINE, NOTICE + words(s) / WPS + DWELL);\n\n  /* ---------------- the copy ---------------- */\n  const OWN = {\n    laterToday: '\"i tell myself i\\'ll go later.\"',\n    scrolling: '\"i start scrolling.\"',\n    exhausted: '\"i\\'m exhausted.\"',\n    scheduleChanges: '\"my schedule changes.\"'\n  };\n  const OWN_AFTER = {\n    laterToday: 'this is that sentence, happening.',\n    scrolling: 'skip, and the apps open. that is the trade.',\n    exhausted: '10 easy minutes lifts energy. today can be a light one.',\n    scheduleChanges: (c) => `if it really did, ${c.homeMin} minutes at home still counts.`\n  };\n  function stage(c) {\n    if (c.visits < 10) return 'new';\n    if (c.visits < 40) return 'building';\n    if (c.visits < 66) return 'close';\n    return 'habit';\n  }\n  function weekReachableWithoutToday(c) { return c.weekDone + (c.plannedLeft - 1) >= c.weekGoal; }\n\n  /* Returns the lines for the 30 s, in order, each with its start time and duration.\n     kind: 'ground' | 'own' | 'quote' | 'stake' | 'fact' | 'close'. A fact carries src. */\n  function lines(c = cfg) {\n    const L = [];\n    const add = (p, kind, text, extra) => L.push(Object.assign({ p, kind, text }, extra || {}));\n\n    // 1. where you are right now\n    if (c.ctx === 'wake') add(1, 'ground', 'you beat the alarm. the rest is shoes and a door.');\n    if (c.ctx === 'trip') add(1, 'ground', `you're ${c.etaMin} minutes from the gym.`);\n    if (c.ctx === 'closed') add(1, 'ground', `gym time was ${c.gymBy}. it is ${c.now} now.`);\n\n    // 2. their own words from day 0\n    if (OWN[c.reason]) {\n      add(2, 'own', 'on day 0 you told us why you miss:');\n      add(2, 'quote', OWN[c.reason]);\n      const after = OWN_AFTER[c.reason];\n      add(2, 'own', typeof after === 'function' ? after(c) : after);\n    }\n\n    // 3. the stakes, from real numbers\n    if (c.lastMissed) add(3, 'stake', 'last time was a skip too. two in a row is where habits slip.');\n    else if (!weekReachableWithoutToday(c)) add(3, 'stake', `skip today and ${c.weekGoal} this week is out of reach.`);\n    else add(6, 'stake', `today would make it ${c.weekDone + 1} of ${c.weekGoal} this week.`);\n\n    // 4. one concrete fact for where they are in the habit\n    const s = stage(c);\n    if (s === 'new') add(4, 'fact', 'people expect a workout to feel worse than it does. they only picture the first minutes.', { src: 'ruby et al., 2011' });\n    if (s === 'building') add(4, 'fact', `every visit makes the next one take less effort. you have ${c.visits} behind you.`, { src: 'lally et al., 2010' });\n    if (s === 'close') add(4, 'fact', `${66 - c.visits} more visits and going stops being a decision.`, { src: 'lally et al., 2010' });\n    if (s === 'habit') add(4, 'fact', `${c.visits} visits. one more keeps it automatic.`, { src: 'lally et al., 2010' });\n\n    // 5. the way forward\n    if (c.ctx === 'closed') add(5, 'close', `go now and you get ${c.graceMin} more minutes.`);\n    else add(5, 'close', `gym by ${c.gymBy}. you can still make it.`);\n\n    // fit into 30 s by reading pace: drop the lowest priority until it fits\n    let fitted = L.slice();\n    const total = arr => START + arr.reduce((a, l) => a + lineDuration(l.text), 0);\n    while (total(fitted) > WAIT - 0.4 && fitted.length > 1) {\n      const worst = fitted.reduce((w, l) => (l.p > w.p ? l : w), fitted[0]);\n      // own words travel as a block of three: drop the whole block or none\n      fitted = worst.p === 2 ? fitted.filter(l => l.p !== 2) : fitted.filter(l => l !== worst);\n    }\n    let t = START;\n    return fitted.map(l => { const d = lineDuration(l.text); const o = Object.assign({}, l, { t, d, words: words(l.text) }); t += d; return o; });\n  }\n\n  /* ---------------- the three choices, in order ---------------- */\n  function choices(c = cfg) {\n    const list = [];\n    list.push({\n      key: 'gym', title: 'still going', icon: 'shoe',\n      lead: c.ctx === 'closed' ? `${c.graceMin} more minutes. not a new window.` : `gym by ${c.gymBy}.`,\n      perks: [`visit ${c.visits + 1} of 66`, `this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'apps unlock when you arrive'],\n      primary: \"i'm going\", secondary: 'not this'\n    });\n    if (c.homeLeft > 0) list.push({\n      key: 'home', title: 'quick workout instead', icon: 'house',\n      lead: `${c.homeMin} minutes at home counts as a full day.`,\n      perks: [`this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'checked by apple health or a photo', `${c.homeLeft} of 3 left this month`],\n      primary: `start ${c.homeMin} minutes`, secondary: 'not this either'\n    });\n    const reachable = weekReachableWithoutToday(c);\n    list.push({\n      key: 'cant', title: \"can't today\", icon: 'calendar',\n      lead: reachable ? `no problem. you need ${c.weekGoal - c.weekDone} more this week.` : 'make it up. this keeps your streak.',\n      perks: [`one skip won't undo ${c.visits} visits`, 'next, pick a day to make it up'],\n      primary: \"can't today\", secondary: 'back to the gym'\n    });\n    return list;\n  }\n\n  /* ---------------- receipt rows (for the printer variant; any variant may use) ---------------- */\n  function receipt(c = cfg) {\n    const rows = [\n      ['gym by', c.gymBy],\n      ['this visit', `${c.visits + 1} of 66`],\n      ['this week', `${c.weekDone} of ${c.weekGoal}`],\n    ];\n    if (c.lastMissed) rows.push(['last time', 'skipped']);\n    if (c.homeLeft >= 0) rows.push(['home workouts', `${c.homeLeft} of 3 left`]);\n    return {\n      rows,\n      said: OWN[c.reason] || null,\n      ifGo: `${c.weekDone + 1} of ${c.weekGoal}`,\n      ifSkip: `${c.weekGoal - c.weekDone} still to do`\n    };\n  }\n\n  /* ---------------- this week as 7 days (Mon first) ----------------\n     state: 'done' | 'today' | 'planned' | 'rest'. Today is Tuesday in the demo. */\n  function week(c = cfg) {\n    const names = ['m', 't', 'w', 't', 'f', 's', 's'];\n    const st = ['done', 'today', 'rest', 'rest', 'rest', 'rest', 'rest'];\n    const later = [3, 5, 4, 6];               // thu, sat, then fri, sun if more are planned\n    for (let i = 0; i < Math.max(0, c.plannedLeft - 1); i++) st[later[i]] = 'planned';\n    return names.map((n, i) => ({ n, state: st[i] }));\n  }\n\n  /* ---------------- the wait button label ---------------- */\n  function timerLabel(elapsed) {\n    const left = Math.max(0, Math.ceil(WAIT - elapsed));\n    return left > 0 ? `0:${String(left).padStart(2, '0')}` : 'continue';\n  }\n\n  /* ---------------- the 30 s clock ---------------- */\n  let t0 = performance.now(), offset = 0;\n  const restartCbs = [];\n  function clock() { return Math.min(WAIT + 600, (performance.now() - t0) / 1000 + offset); }\n  function restart() { t0 = performance.now(); offset = 0; restartCbs.forEach(f => f(cfg)); }\n  function skip() { offset = Math.max(offset, WAIT - (performance.now() - t0) / 1000); }\n  function onRestart(f) { restartCbs.push(f); }\n\n  /* ---------------- demo haptic log (real app: UIImpactFeedbackGenerator) ----------------\n     kinds: 'light' (printer tick), 'soft' (a line lands), 'rigid' (choice changes),\n            'medium' (the 30 s is up), 'heavy' (commit: i'm going / start). */\n  let lastHap = 0;\n  function hap(kind) {\n    const now = performance.now();\n    if (kind === 'light' && now - lastHap < 70) return; // rate limit, as WakeHaptics does\n    lastHap = now;\n    try { parent.postMessage({ gl: 'hap', kind }, '*'); } catch (e) {}\n  }\n  function done(what) { try { parent.postMessage({ gl: 'done', what }, '*'); } catch (e) {} }\n\n  window.addEventListener('message', e => {\n    const m = e.data || {};\n    if (m.gl === 'config') { cfg = Object.assign({}, DEFAULT, m.cfg); restart(); }\n    if (m.gl === 'skip') skip();\n    if (m.gl === 'restart') restart();\n  });\n\n  window.GL = { week, timerLabel, WAIT, DEFAULT, get cfg() { return cfg; }, lines, choices, receipt, stage, lineDuration, clock, restart, skip, onRestart, hap, done };\n})();\n<\/script>\n<script>/* GymLock \u00b7 \"can't today\" one screen \u00b7 shared DATA only (no look).\n   Every variant reads MU.data() after the approved pause ends. Real app: SkipRules.screen,\n   ReschedulePlanner.choices / defaultTime / isTimeAvailable, HomeWorkoutRules, streak.\n   Do not edit from a variant. */\n(function () {\n  const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];\n  const FULL = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];\n  const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };\n  // display: 12 h, lowercase, no leading zero: \"6:30 am\"\n  const fmt = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; const h12 = h % 12 || 12; return { h: h12, m: String(mm).padStart(2, '0'), ap: h < 12 ? 'am' : 'pm', text: `${h12}:${String(mm).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}` }; };\n\n  function data(c = GL.cfg) {\n    const sleepStart = toMin(c.sleepStart || '22:30'), sleepEnd = toMin(c.sleepEnd || '5:30');\n    const nowMin = toMin(c.now);\n    const usual = toMin(c.alarmAt);\n    const reachable = c.weekDone + (c.plannedLeft - 1) >= c.weekGoal;\n    const need = c.weekGoal - c.weekDone;\n    const wk = GL.week(c);                       // 7 days, mon first: done | today | planned | rest\n    const ti = wk.findIndex(d => d.state === 'today');\n    const earliestToday = Math.ceil((nowMin + 30) / 15) * 15;   // at least 30 min from now\n    const inSleep = m => sleepStart > sleepEnd ? (m >= sleepStart || m < sleepEnd) : (m >= sleepStart && m < sleepEnd);\n\n    // targets you can move today's workout to: later today + days left this week that aren't planned\n    const targets = [];\n    if (earliestToday < sleepStart) targets.push({ key: 'today', idx: ti, short: 'today', name: 'later today', isToday: true, defaultMin: earliestToday });\n    wk.forEach((d, i) => { if (i > ti && d.state === 'rest') targets.push({ key: DAYS[i], idx: i, short: DAYS[i], name: FULL[i], isToday: false, defaultMin: usual }); });\n\n    function allowed(t, m) {\n      m = ((m % 1440) + 1440) % 1440;\n      if (inSleep(m)) return { ok: false, why: 'inside your sleep hours' };\n      if (t.isToday && m < earliestToday) return { ok: false, why: 'too soon' };\n      return { ok: true };\n    }\n\n    // what skipping costs, from real numbers. Empty when it costs nothing.\n    const cost = [];\n    if (!reachable) cost.push({ k: 'week', big: `${c.weekDone}/${c.weekGoal}`, text: `${c.weekGoal} this week out of reach` });\n    if (c.lastMissed) cost.push({ k: 'row', big: '2\u00d7', text: 'second skip in a row' });\n    if (!reachable && c.streakWeeks > 0) cost.push({ k: 'streak', big: String(c.streakWeeks), text: `${c.streakWeeks}-week streak at risk`, hot: true });\n\n    return {\n      heading: reachable ? `no problem. you need ${need} more this week.` : 'make it up. this keeps your streak.', // exact FLOW copy\n      reachable, need, weekDone: c.weekDone, weekGoal: c.weekGoal, streakWeeks: c.streakWeeks,\n      week: wk, todayIdx: ti, days: DAYS, targets, usualMin: usual, nowMin, sleepStart, sleepEnd,\n      allowed, fmt, cost,\n      home: c.homeLeft > 0 ? { minutes: c.homeMin, left: c.homeLeft, of: 3 } : null,\n      // FLOW order: week at risk -> reschedule first, home, skip last (hold).\n      //             week fine    -> skip first (plain tap), reschedule, home.\n      order: reachable ? ['skip', 'reschedule', 'home'] : ['reschedule', 'home', 'skip'],\n      skipNeedsHold: !reachable  // hold only when skipping loses the week; then skip is last (FLOW)\n    };\n  }\n  window.MU = { data, fmt, toMin };\n})();\n<\/script>\n<script>\n(function(){\nconst $=id=>document.getElementById(id);\nconst RM=matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst ease=p=>1-Math.pow(1-p,3);\nconst prog=(lt,a,d)=>clamp((lt-a)/d,0,1);\nlet S;\nfunction esc(s){return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;')}\nconst SPK='<svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M2 6h3l4-3v10L5 10H2z\" fill=\"#fff\"/>',\n MUTE=SPK+'<path d=\"M11.5 5.5l3 5M14.5 5.5l-3 5\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\/svg>',\n LOUD=SPK+'<path d=\"M11.5 5.5q2 2.5 0 5M13.3 3.8q3.6 4.2 0 8.4\" stroke=\"#fff\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><\/svg>';\n\n/* ---------- icons (2pt line, round caps) ---------- */\nconst IC={\n bell:'<path d=\"M12 3.5a6 6 0 0 0-6 6V14l-1.6 2.6h15.2L18 14V9.5a6 6 0 0 0-6-6z\"/><path d=\"M10 19.5a2 2 0 0 0 4 0\"/>',\n sunrise:'<path d=\"M3 18.5h18\"/><path d=\"M7 18.5a5 5 0 0 1 10 0\"/><path d=\"M12 6.5v2.6M4.8 10.6l1.8 1.8M19.2 10.6l-1.8 1.8\"/>',\n dumbbell:'<path d=\"M6.5 7.5v9M17.5 7.5v9M3.5 10v4M20.5 10v4M6.5 12h11\"/>',\n house:'<path d=\"M3.5 11.2L12 4l8.5 7.2\"/><path d=\"M5.8 9.6V20h12.4V9.6\"/><path d=\"M10 20v-5.4h4V20\"/>'\n};\nfunction ic(n,s){return '<svg class=\"ic\" width=\"'+s+'\" height=\"'+s+'\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">'+IC[n]+'<\/svg>'}\n\n/* ---------- the app's flame (flame.fill shape) ---------- */\nconst FP='M13 1C14.6 5.6 19.6 9 19.8 16C20 21.6 16.6 26.6 12 26.6C7.4 26.6 4 22.6 4.2 17C4.3 13.6 6 11 7.8 9.2C8 11 8.8 12 9.8 12.4C9 8 10.4 4.2 13 1Z M12 24.2C9.9 24.2 8.6 22.6 8.6 20.8C8.6 18.6 10.5 17.4 11.4 15.6C11.7 16.8 12.6 17.2 13.4 18C14.2 18.8 15.4 19.4 15.4 20.8C15.4 22.6 14.1 24.2 12 24.2Z';\nfunction flame(w,h,lit){\n  const d=document.createElement('div');d.className='fl';d.style.width=w+'px';d.style.height=h+'px';\n  d.innerHTML='<svg class=\"fo ic\" viewBox=\"0 0 24 28\" aria-hidden=\"true\"><path d=\"'+FP+'\" fill-rule=\"evenodd\" style=\"vector-effect:non-scaling-stroke\"/><\/svg><svg class=\"ff\" viewBox=\"0 0 24 28\" aria-hidden=\"true\"><path d=\"'+FP+'\" fill-rule=\"evenodd\" fill=\"url(#fg)\"/><\/svg>';\n  d.ff=d.querySelector('.ff');d.fo=d.querySelector('.fo');\n  if(lit)setLit(d,1);\n  return d;\n}\nfunction setLit(f,p){f.ff.style.opacity=p;f.fo.style.opacity=1-p}\nfunction weekRow(w,h,gap,opts){\n  const c=GL.cfg,g=c.weekGoal,d=c.weekDone;const row=document.createElement('div');row.className='wrow';row.fl=[];\n  for(let k=0;k<g;k++){\n    if(k>0){const cn=document.createElement('div');cn.className='conn'+(k<=d-1?' on':'');cn.style.width=gap+'px';row.appendChild(cn)}\n    const f=flame(w,h,k<d);\n    if(k===d&&opts&&opts.today){f.classList.add(opts.today)}\n    if(k===d&&opts&&opts.label){const l=document.createElement('div');l.className='tdl';l.textContent='today';f.appendChild(l)}\n    row.appendChild(f);row.fl.push(f);\n  }\n  row.todayFl=row.fl[d]||null;\n  return row;\n}\n\n/* ---------- beats ---------- */\nfunction mkBeat(id,aria){const el=document.createElement('div');el.className='beat';el.setAttribute('role','group');el.setAttribute('aria-label',aria);$('stage').appendChild(el);return {id,el,aria,fired:{}}}\nfunction capEl(b,text,src){\n  const c=document.createElement('div');c.className='bcap';c.textContent=text;b.el.appendChild(c);b.cap=c;\n  if(src){const s=document.createElement('div');s.className='bsrc';s.textContent=src;b.el.appendChild(s);b.src=s}\n}\nfunction fire(b,k,lt,at,kind){if(!b.fired[k]&&lt>=at){b.fired[k]=1;GL.hap(kind)}}\n\nfunction bGround(L){\n  const c=GL.cfg,b=mkBeat('ground',L.text);\n  const W=Math.min(334,innerWidth-56),R=36,cx=[R,W/2,W-R];\n  const frac=c.ctx==='trip'?.86:.5, a2=cx[1]+R, b2=cx[2]-R, x2=a2+(b2-a2)*frac;\n  const gl=c.ctx==='closed'?c.gymBy+' \\u00B7 '+c.now+' now':'gym by '+c.gymBy;\n  const w=document.createElement('div');w.className='gr';w.style.width=W+'px';\n  const tk=(id,x)=>'<g id=\"'+id+'\" transform=\"translate('+(x+25)+' 11)\" opacity=\"0\"><circle r=\"11\" fill=\"#fff\"/><path d=\"M-5 .5L-1.5 4L5.5-3.5\" pathLength=\"1\" stroke=\"#0B0B0C\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"1\" stroke-dashoffset=\"1\"/><\/g>';\n  w.innerHTML=\n   '<div class=\"nd\" style=\"left:'+(cx[0]-R)+'px\">'+ic('bell',36)+'<\/div><div class=\"nl\" style=\"left:'+cx[0]+'px\">'+esc(c.alarmAt)+'<\/div>'+\n   '<div class=\"nd\" style=\"left:'+(cx[1]-R)+'px\">'+ic('sunrise',36)+'<\/div><div class=\"nl\" style=\"left:'+cx[1]+'px\">up<\/div>'+\n   '<div class=\"nd off\" style=\"left:'+(cx[2]-R)+'px\">'+ic('dumbbell',36)+'<\/div><div class=\"nl\" style=\"left:'+cx[2]+'px;'+(c.ctx==='closed'?'color:#fff':'')+'\">'+esc(gl)+'<\/div>'+\n   '<svg class=\"ov\" width=\"'+W+'\" height=\"80\" viewBox=\"0 0 '+W+' 80\" fill=\"none\" aria-hidden=\"true\">'+\n   '<path d=\"M'+a2+' 36H'+b2+'\" stroke=\"rgba(255,255,255,.2)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 5\"/>'+\n   '<path id=\"s1\" d=\"M'+(cx[0]+R)+' 36H'+(cx[1]-R)+'\" pathLength=\"1\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1\" stroke-dashoffset=\"1\"/>'+\n   '<path id=\"s2\" d=\"M'+a2+' 36H'+x2+'\" pathLength=\"1\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1\" stroke-dashoffset=\"1\"/>'+\n   '<circle id=\"ring\" cx=\"'+x2+'\" cy=\"36\" r=\"5\" stroke=\"#fff\" stroke-width=\"1.5\" opacity=\"0\"/><circle id=\"dot\" cx=\"'+x2+'\" cy=\"36\" r=\"5\" fill=\"#fff\" opacity=\"0\"/>'+\n   tk('t1',cx[0])+tk('t2',cx[1])+'<\/svg>';\n  b.el.appendChild(w);\n  capEl(b,c.ctx==='trip'?'almost there.':'two of three done.');\n  const q=s=>w.querySelector(s);\n  const s1=q('#s1'),s2=q('#s2'),t1=q('#t1'),t2=q('#t2'),dot=q('#dot'),ring=q('#ring');\n  const tick=(g,lt,a)=>{const p=prog(lt,a,.25);g.setAttribute('opacity',p>0?1:0);g.setAttribute('transform',g.getAttribute('transform').replace(/ scale\\([^)]*\\)/,'')+' scale('+(.6+.4*ease(p))+')');g.lastChild.setAttribute('stroke-dashoffset',1-prog(lt,a+.15,.3))};\n  b.update=lt=>{\n    tick(t1,lt,.45);fire(b,'a',lt,.45,'light');\n    s1.setAttribute('stroke-dashoffset',1-ease(prog(lt,.85,.4)));\n    tick(t2,lt,1.3);fire(b,'b',lt,1.3,'light');\n    s2.setAttribute('stroke-dashoffset',1-ease(prog(lt,1.8,.8)));\n    const dp=prog(lt,2.5,.2);dot.setAttribute('opacity',dp);\n    const pz=RM||lt<2.5?0:((lt-2.5)%1.4)/1.4;ring.setAttribute('r',5+8*pz);ring.setAttribute('opacity',dp*(1-pz)*.6);\n    b.cap.style.opacity=prog(lt,1.9,.4);\n  };\n  return b;\n}\n\nfunction bOwn(Ls){\n  const q=Ls.find(l=>l.kind==='quote');\n  const b=mkBeat('own',Ls.map(l=>l.text).join(' '));\n  const txt=q.text.replace(/^[\"\u201c]|[\"\u201d]$/g,'');\n  b.el.innerHTML='<div class=\"qlab\">you, on day 0<\/div><div class=\"qm\" aria-hidden=\"true\">\u201c<\/div><div class=\"qt\"><\/div><div class=\"qm qm2\" aria-hidden=\"true\" style=\"height:30px;line-height:.9\">\u201d<\/div>';\n  const qt=b.el.querySelector('.qt');\n  const ws=txt.split(/\\s+/).map((w,k,a)=>{const s=document.createElement('span');s.className='w';s.textContent=w;qt.appendChild(s);if(k<a.length-1)qt.appendChild(document.createTextNode(' '));return s});\n  const lab=b.el.querySelector('.qlab'),m1=b.el.children[1],m2=b.el.children[3];\n  m2.style.opacity=0;\n  b.update=lt=>{\n    lab.style.opacity=prog(lt,.1,.4);\n    m1.style.opacity=prog(lt,.1,.5);m1.style.transform=RM?'none':'scale('+(.85+.15*ease(prog(lt,.1,.5)))+')';\n    ws.forEach((w,i)=>{const p=prog(lt,.45+i*.14,.3);w.style.opacity=p;w.style.transform=RM?'none':'translateY('+(1-ease(p))*6+'px)'});\n    m2.style.opacity=prog(lt,.45+ws.length*.14,.4);\n  };\n  return b;\n}\n\nfunction bStake(L){\n  const c=GL.cfg,b0=c.weekDone+c.plannedLeft-1<c.weekGoal;\n  const weak=c.lastMissed||b0;\n  const capT=c.lastMissed?'two in a row cools it.':b0?'skip and the week is out.':'today keeps the flame.';\n  const wk=c.streakWeeks===1?'week':'weeks';\n  const b=mkBeat('stake',(L?L.text:capT)+' '+c.streakWeeks+' '+wk+' streak.');\n  const sk=document.createElement('div');sk.className='sk';\n  const big=flame(84,98,true);\n  const nb=document.createElement('div');nb.innerHTML='<div class=\"num rnd\">'+c.streakWeeks+'<\/div><div class=\"unit\">'+wk+'<\/div>';\n  sk.appendChild(big);sk.appendChild(nb);b.el.appendChild(sk);\n  const row=weekRow(34,40,26,{label:1});row.style.marginTop='34px';b.el.appendChild(row);\n  const today=row.todayFl;\n  capEl(b,capT);\n  b.update=lt=>{\n    // big flame weakens for a second, then recovers\n    let w=0;if(weak)w=RM?.7:prog(lt,.5,.4)*(1-prog(lt,1.8,.7));\n    big.style.transform='scale('+(1-.08*w)+')';\n    big.style.filter='saturate('+(1-.4*w)+')';\n    // today flame flickers toward lit, then falls back\n    if(today){\n      const env=Math.sin(Math.PI*prog(lt,.6,1.3));\n      const nz=RM?1:(.62+.38*Math.abs(Math.sin(lt*31)*Math.sin(lt*17+1)));\n      setLit(today,clamp(env*.85*nz,0,1));\n      fire(b,'l',lt,1.05,'light');\n      const br=lt>1.9?(Math.sin((lt-1.9)*2.6)+1)/2:0;\n      today.style.transform=RM?'none':'scale('+(1+.05*br)+')';\n      today.style.opacity=lt>1.9?.65+.35*br:1;\n    }\n    b.cap.style.opacity=prog(lt,.9,.4);\n  };\n  return b;\n}\n\nfunction bFact(L){\n  const c=GL.cfg,st=GL.stage(c),v=c.visits;\n  const capT={new:'the first minutes are the worst.',building:'each visit gets easier.',close:(66-v)+' more and it\u2019s automatic.',habit:'one more keeps it automatic.'}[st];\n  const srcT=L&&L.src?L.src:(st==='new'?'ruby et al., 2011':'lally et al., 2010');\n  const b=mkBeat('fact',L?L.text:capT);\n  const h=document.createElement('div');h.className='f66';\n  h.innerHTML='<span class=\"num rnd\">'+(st==='habit'?v:v+1)+'<\/span><span class=\"of\">'+(st==='habit'?'visits':'of 66')+'<\/span>';\n  b.el.appendChild(h);\n  const g=document.createElement('div');g.className='dots';g.setAttribute('aria-hidden','true');\n  const ds=[];for(let i=0;i<66;i++){const d=document.createElement('i');if(i===v&&v<66)d.className='nx';g.appendChild(d);ds.push(d)}\n  b.el.appendChild(g);capEl(b,capT,srcT);\n  const step=Math.min(.03,1.1/Math.max(1,v));\n  b.update=lt=>{\n    for(let i=0;i<Math.min(v,66);i++){const p=prog(lt,.3+i*step,.2);ds[i].style.background='rgba(255,255,255,'+(.16+.84*p)+')'}\n    const nx=ds[v];if(nx&&v<66){const a=prog(lt,.3+v*step+.2,.3);nx.style.opacity=a;const pp=RM?0:Math.sin(Math.PI*prog(lt,1.7,.9));nx.style.transform='scale('+(1+.55*pp)+')'}\n    b.cap.style.opacity=prog(lt,1.0,.4);if(b.src)b.src.style.opacity=prog(lt,1.5,.4);\n  };\n  return b;\n}\n\nfunction bClose(L){\n  const c=GL.cfg,closed=c.ctx==='closed';\n  const b=mkBeat('close',L.text);\n  b.el.innerHTML='<div class=\"ic\" style=\"color:#fff\">'+ic('dumbbell',56)+'<\/div>'+\n   (closed?'<div class=\"big rnd\">+'+c.graceMin+'<\/div><div class=\"bigl\">min<\/div>':'<div class=\"bigl\" style=\"margin-top:20px\">gym by<\/div><div class=\"big rnd\" style=\"margin-top:6px\">'+esc(c.gymBy)+'<\/div>');\n  capEl(b,closed?'if you go now.':'you can still make it.');\n  const kids=[b.el.children[0],b.el.children[1],b.el.children[2]];\n  b.update=lt=>{kids.forEach((k,i)=>{k.style.opacity=prog(lt,i*.2,.4)});b.cap.style.opacity=prog(lt,.9,.4)};\n  return b;\n}\n\nfunction mkBeats(){\n  const L=GL.lines(),by=k=>L.find(l=>l.kind===k);\n  const g=by('ground'),q=by('quote'),st=by('stake'),f=by('fact'),cl=by('close');\n  const B=[];\n  if(g){const b=bGround(g);b.start=g.t;B.push(b)}\n  if(q){const b=bOwn(L.filter(l=>l.kind==='own'||l.kind==='quote'));b.start=q.t;B.push(b)}\n  // stake: always shown, even when its line was dropped to fit 30 s. Quote keeps >= 4.5 s; the next beat gives way.\n  {\n    let fb=null,cb=null;\n    if(f){fb=bFact(f);fb.start=f.t}\n    if(cl){cb=bClose(cl);cb.start=cl.t}\n    const nxt=fb||cb;\n    const prev=B.length?B[B.length-1]:null;let s;\n    if(st)s=st.t;\n    else{\n      const need=prev?(prev.id==='own'?4.5:3.2):0;\n      s=Math.max((prev?prev.start:0)+need,(nxt?nxt.start:GL.WAIT-3)-4);\n    }\n    const b=bStake(st);b.start=s;B.push(b);\n    if(nxt&&nxt.start<s+3.2)nxt.start=s+3.2;\n    if(fb&&cb&&cb.start<fb.start+2.5)cb.start=fb.start+2.5;\n    if(fb)B.push(fb);if(cb)B.push(cb);\n  }\n  B.sort((a,b)=>a.start-b.start);\n  return B;\n}\n\n\n/* ===== over-the-video layer (video / photo). Their own voice leads; we add only what the video can't say:\n   the streak at stake, minutes left to the gym, and where they are in the 66. One short line at a time, low. ===== */\nconst toM=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+m};\nfunction ltBuild(){\n  const c=GL.cfg,L=GL.lines();let lt=$('lt');\n  if(!lt){lt=document.createElement('div');lt.id='lt';lt.innerHTML='<div id=\"ltcap\"><\/div><div id=\"ltchips\"><\/div>';$('app').insertBefore(lt,$('fine'))}\n  lt.style.opacity=1;\n  const left=Math.max(0,toM(c.gymBy)-toM(c.now)),closed=c.ctx==='closed';\n  const chips=[];\n  if(c.streakWeeks>0)chips.push({k:'stake',html:'<span class=\"fx\"><\/span><b>'+c.streakWeeks+'<\/b><span>'+(c.streakWeeks===1?'week':'weeks')+'<\/span>'});\n  chips.push({k:'close',html:closed?'<b>+'+c.graceMin+'<\/b><span>min if you go now<\/span>':'<b>'+left+'<\/b><span>min to gym<\/span>'});\n  chips.push({k:'fact',html:'<b>'+Math.min(66,c.visits+1)+'<\/b><span>of 66<\/span><i class=\"bar\"><i style=\"width:'+Math.min(100,Math.round(c.visits/66*100))+'%\"><\/i><\/i>'});\n  const box=$('ltchips');box.innerHTML='';\n  S.ltChips=chips.map(ch=>{const e=document.createElement('div');e.className='lc';e.dataset.k=ch.k;e.innerHTML=ch.html;box.appendChild(e);return e});\n  const fx=box.querySelector('.fx');if(fx){const f=flame(15,18,true);fx.replaceWith(f)}\n  const cap=$('ltcap');cap.innerHTML='';\n  S.ltLines=L.map(l=>{\n    const wrap=document.createElement('div');wrap.style.cssText='position:absolute;left:0;right:0;bottom:0;opacity:0';\n    const isQ=l.kind==='quote',ws=(isQ?l.text.replace(/^[\"\u201c]|[\"\u201d]$/g,''):l.text).trim().split(/\\s+/);\n    wrap.innerHTML=(isQ?'<div class=\"capk\">you, on day 0<\/div>':'')+'<div class=\"cap'+(isQ?' q':'')+'\">'+ws.map((w,i)=>'<span class=\"w\">'+esc(w)+(i<ws.length-1?' ':'')+'<\/span>').join('')+'<\/div>';\n    cap.appendChild(wrap);return {l,el:wrap,ws:[...wrap.querySelectorAll('.w')],k:wrap.querySelector('.capk')};\n  });\n  cap.style.position='relative';\n  // audio wave in the top label while sound is on\n  if(!$('wave')){const w=document.createElement('span');w.id='wave';w.innerHTML='<i><\/i><i><\/i><i><\/i><i><\/i>';$('meta').appendChild(w)}\n  else $('meta').appendChild($('wave'));\n}\nfunction ltFrame(now){\n  if(!S.ltLines)return;\n  let cur=-1;S.ltLines.forEach((o,i)=>{if(now>=o.l.t)cur=i});\n  S.ltLines.forEach((o,i)=>{\n    const last=i===S.ltLines.length-1,l=o.l;\n    if(i!==cur&&!(i===cur-1&&now<S.ltLines[cur].l.t+.22)){o.el.style.opacity=0;return}\n    if(i===cur-1){const p=clamp((now-S.ltLines[cur].l.t)/.22,0,1);o.el.style.opacity=1-p;o.el.style.transform=RM?'':'translateY('+(-8*p)+'px)';return}\n    o.el.style.opacity=1;o.el.style.transform='';\n    const stag=o.ws.length>1?Math.min(.12,Math.max(0,.35*l.d-.2)/(o.ws.length-1)):0;\n    o.ws.forEach((w,j)=>{const a=clamp((now-l.t-j*stag)/.22,0,1);w.style.opacity=a;w.style.transform=RM?'':'translateY('+(4*(1-a))+'px)'});\n    if(o.k)o.k.style.opacity=clamp((now-l.t)/.3,0,1);\n  });\n  const k=cur>=0?S.ltLines[cur].l.kind:'';\n  const on=k==='stake'?'stake':k==='fact'?'fact':(k==='close'||k==='ground')?'close':'';\n  S.ltChips.forEach(e=>e.classList.toggle('on',e.dataset.k===on));\n  if(cur!==S.ltCur){S.ltCur=cur;if(cur>=0)GL.hap('soft')}\n  const wv=$('wave');if(wv)wv.style.display=S.mode==='video'?'':'none';if(wv&&S.mode==='video'){const live=S.mode==='video'&&!S.muted;wv.style.opacity=live?1:.35;[...wv.children].forEach((b,i)=>{b.style.height=(live&&!RM?3+8*Math.abs(Math.sin(now*(5+i*1.7)+i)):3)+'px'})}\n}\n\n/* ---------- build ---------- */\nfunction build(){\n  const cfg=GL.cfg,mode=cfg.day0;\n  S={mode,phase:'play',cur:-2,idx:0,chs:GL.choices(),frozen:false,busy:false};\n  $('stage').innerHTML='';S.B=mkBeats();\n  $('stage').classList.remove('hide');$('media').classList.remove('dark');\n  ['prog','meta','snd','fine','timer'].forEach(i=>$(i).classList.remove('hide'));\n  $('timer').classList.remove('ready');$('tlab').textContent=GL.timerLabel(0);$('tfill').style.transform='scaleX(0)';\n  muReset();$('end').classList.remove('on');$('end').textContent='';\n  $('fill').style.transform='scaleX(0)';\n  const has=mode==='video'||mode==='photo';\n  $('media').style.display=has?'':'none';\n  $('meta').style.display=has?'':'none';\n  $('meta').textContent='you, on day 0 \u00b7 '+cfg.day0Date;\n  $('snd').style.display=mode==='video'?'':'none';\n  S.muted=true;$('snd').firstChild.innerHTML=MUTE;\n  $('horizon').style.display=mode==='photo'?'block':'none';\n  $('label').style.opacity=1;$('label').textContent=mode==='video'?'your day 0 video plays here':'your day 0 photo';\n  $('app').classList.toggle('vid',has);S.ltLines=null;S.ltCur=-2;\n  if(has){ltBuild();if(mode==='video'){S.muted=false;$('snd').firstChild.innerHTML=LOUD}}\n  else if($('lt'))$('lt').style.opacity=0;\n}\n\nfunction frame(){\n  requestAnimationFrame(frame);\n  if(!S||S.phase==='end'||S.phase==='choices')return;\n  const now=GL.clock(),t=Math.min(now,GL.WAIT);\n  if(S.phase==='play'){\n    $('fill').style.transform='scaleX('+(t/GL.WAIT)+')';\n    $('tfill').style.transform='scaleX('+(t/GL.WAIT)+')';\n    $('tlab').textContent=GL.timerLabel(now);\n    if(S.mode!=='none'){\n      const m=RM?0:1;\n      if(S.mode==='video'){\n        $('b1').style.transform='translate('+(Math.sin(t*.23)*90*m-60)+'px,'+(Math.cos(t*.17)*70*m-120)+'px) scale('+(1+Math.sin(t*.11)*.08*m)+')';\n        $('b2').style.transform='translate('+(Math.cos(t*.19+1)*100*m+80)+'px,'+(Math.sin(t*.13+2)*80*m+150)+'px) scale('+(1+Math.cos(t*.09)*.08*m)+')';\n        $('kb').style.transform='none';\n      }else{\n        $('b1').style.transform='translate(-50px,-110px)';$('b2').style.transform='translate(70px,140px)';\n        $('kb').style.transform='scale('+(1+(RM?0:.08*t/GL.WAIT))+')';\n      }\n    }\n  }\n  if(S.ltLines){ltFrame(now);if(S.phase==='play'&&now>=GL.WAIT)freeze();return}\n  const B=S.B;let cur=-1;$('label').style.opacity=(B.length&&now>=B[0].start)?0:1;B.forEach((b,i)=>{if(now>=b.start)cur=i});\n  if(cur!==S.cur){S.cur=cur;if(cur>=0)GL.hap('soft')}\n  B.forEach((b,i)=>{\n    let o=0,tf='';\n    if(i===cur){const lt=now-b.start,p=ease(clamp(lt/.36,0,1));o=p;tf=RM?'':'translateY('+(10*(1-p))+'px)';b.update(lt)}\n    else if(i<cur){const po=clamp((now-B[i+1].start)/.24,0,1);o=1-po;tf=RM?'':'scale('+(1-.04*po)+')';if(po<1)b.update(B[i+1].start-b.start)}\n    b.el.style.opacity=o;b.el.style.transform=tf;b.el.style.visibility=o>0?'visible':'hidden';\n  });\n  if(S.phase==='play'&&now>=GL.WAIT)freeze();\n}\nfunction freeze(){\n  if(S.frozen)return;S.frozen=true;S.phase='wait';\n  $('fill').style.transform='scaleX(1)';$('tfill').style.transform='scaleX(1)';$('tlab').textContent='continue';\n  $('media').classList.add('dark');$('fine').classList.add('hide');\n  $('timer').classList.add('ready');\n  GL.hap('medium');\n}\n/* ===================== MU shared: reel, time model, hold, chips ===================== */\nObject.assign(IC,{\n cal:'<rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15\" rx=\"3.5\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/>',\n rep:'<path d=\"M4.5 11.5V10a3 3 0 0 1 3-3h11M15.5 4l3 3-3 3M19.5 12.5V14a3 3 0 0 1-3 3h-11M8.5 20l-3-3 3-3\"/>',\n arr:'<path d=\"M5 12h14M13 6l6 6-6 6\"/>'\n});\nconst rbPx=(o,dim)=>{const c=.55;return (o*dim*c)/(dim+c*Math.abs(o))};\nconst active=new Set();let loopRaf=0,loopT=0;\nfunction loop(t){\n  const dt=Math.min(.033,Math.max(.001,(t-loopT)/1000||.016));loopT=t;\n  active.forEach(r=>r.step(dt));\n  loopRaf=active.size?requestAnimationFrame(loop):0;\n}\nfunction wake(r){active.add(r);if(!loopRaf){loopT=performance.now();loopRaf=requestAnimationFrame(loop)}}\n\n/* drum reel: 1:1 drag, projected momentum, spring snap, rubber band, tap a row, wheel */\nfunction Reel(el,o){\n  const n=o.items.length,r={pos:o.start||0,vel:0,tgt:o.start||0,mode:'idle',n};\n  el.classList.add('reel');el.setAttribute('role','spinbutton');if(o.label)el.setAttribute('aria-label',o.label);\n  const pool=[];\n  for(let k=0;k<7;k++){const d=document.createElement('div');d.className='rw';d.innerHTML='<span><\/span>';el.appendChild(d);pool.push(d)}\n  let H=60,last=Math.round(r.pos),g=null,wt=0;\n  const K=RM?420:150,C=RM?41:22;\n  r.measure=()=>{H=parseFloat(getComputedStyle(el).getPropertyValue('--rh'))||60};\n  r.idx=()=>{const b=Math.round(r.pos);return o.wrap?((b%n)+n)%n:clamp(b,0,n-1)};\n  r.render=quiet=>{\n    const base=Math.round(r.pos);\n    for(let k=-3;k<=3;k++){\n      const i=base+k,row=pool[k+3];\n      if(!o.wrap&&(i<0||i>=n)){row.style.opacity=0;continue}\n      const ix=o.wrap?((i%n)+n)%n:i,d=i-r.pos,a=Math.abs(d);\n      const sc=1-.27*Math.min(a,1.7),op=Math.pow(Math.max(0,1-a*.43),1.5);\n      const dm=o.dim?o.dim(ix):false;\n      row.style.transform='translateY('+(d*H).toFixed(1)+'px) rotateX('+clamp(-d*34,-70,70).toFixed(1)+'deg) scale('+sc.toFixed(3)+')';\n      row.style.opacity=(dm?op*.34:op).toFixed(3);\n      const s=row.firstChild,tx=o.items[ix];if(s._t!==tx){s.textContent=tx;s._t=tx}\n      if(row._dm!==dm){row._dm=dm;row.classList.toggle('dm',dm)}\n      row.classList.toggle('sel',a<.5);\n    }\n    if(base!==last){last=base;if(!quiet){GL.hap('light');o.onTick&&o.onTick(r)}}\n  };\n  r.step=dt=>{\n    const a=-K*(r.pos-r.tgt)-C*r.vel;r.vel+=a*dt;r.pos+=r.vel*dt;\n    if(Math.abs(r.pos-r.tgt)<.002&&Math.abs(r.vel)<.03){\n      r.pos=r.tgt;r.vel=0;r.mode='idle';active.delete(r);r.render();o.onSettle&&o.onSettle(r.idx());return;\n    }\n    r.render();\n  };\n  r.springTo=t=>{\n    if(!o.wrap)t=clamp(t,0,n-1);\n    r.tgt=t;r.mode='spring';wake(r);\n  };\n  r.to=(idx,inst)=>{\n    let t=idx;\n    if(o.wrap){const b=Math.round(r.pos),c=((b%n)+n)%n;let d=((idx-c)%n+n)%n;if(d>n/2)d-=n;t=b+d}\n    if(inst){r.pos=t;r.tgt=t;r.vel=0;r.mode='idle';active.delete(r);last=Math.round(r.pos);r.render(true);return}\n    if(t===r.pos&&r.mode==='idle')return;\n    r.springTo(t);\n  };\n  const rubber=raw=>{\n    if(o.wrap)return raw;\n    const over=raw<0?raw:(raw>n-1?raw-(n-1):0);\n    return over?raw-over+rbPx(over*H,H*3)/H:raw;\n  };\n  el.addEventListener('pointerdown',e=>{\n    r.measure();\n    const was=r.mode==='spring';\n    active.delete(r);r.mode='drag';r.vel=0;\n    g={y:e.clientY,pos:r.pos,t:e.timeStamp,moved:0,was,s:[{t:e.timeStamp,y:e.clientY}]};\n    try{el.setPointerCapture(e.pointerId)}catch(_){}\n  });\n  el.addEventListener('pointermove',e=>{\n    if(!g)return;\n    const dy=e.clientY-g.y;g.moved=Math.max(g.moved,Math.abs(dy));\n    r.pos=rubber(g.pos-dy/H);\n    g.s.push({t:e.timeStamp,y:e.clientY});while(g.s.length>2&&e.timeStamp-g.s[0].t>100)g.s.shift();\n    r.render();\n  });\n  const up=e=>{\n    if(!g)return;const q=g;g=null;\n    if(q.moved<6&&e.timeStamp-q.t<400){\n      if(q.was){r.springTo(Math.round(r.pos));return}\n      const rc=el.getBoundingClientRect(),d=Math.round((e.clientY-(rc.top+rc.height/2))/H);\n      r.springTo(Math.round(r.pos)+d);return;\n    }\n    const s=q.s,f=s[0],l=s[s.length-1];let v=0;\n    if(s.length>1&&e.timeStamp-l.t<80&&l.t-f.t>8)v=-((l.y-f.y)/H)/((l.t-f.t)/1000);\n    v=clamp(v,-40,40);\n    const tg=Math.round(r.pos+(RM?0:v*.22));\n    r.vel=v;r.springTo(tg);\n  };\n  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);\n  el.addEventListener('wheel',e=>{\n    e.preventDefault();r.measure();active.delete(r);r.mode='wheel';r.vel=0;\n    r.pos=rubber(r.pos+e.deltaY/(H*1.6));r.render();\n    clearTimeout(wt);wt=setTimeout(()=>{r.springTo(Math.round(r.pos))},110);\n  },{passive:false});\n  r.measure();r.render(true);\n  return r;\n}\n\n/* hour / minute / am-pm model for one target */\nfunction mkTime(D,els,hk){\n  const toM=(hi,mi,pi)=>(((hi+1)%12)+(pi?12:0))*60+mi*5;\n  let tg=null;const R={};\n  const dimf=k=>i=>{\n    if(!tg)return false;\n    const a=[R.h?R.h.idx():0,R.m?R.m.idx():0,R.p?R.p.idx():0];a['hmp'.indexOf(k)]=i;\n    return !D.allowed(tg,toM(a[0],a[1],a[2])).ok;\n  };\n  const ra=()=>{['h','m','p'].forEach(k=>R[k]&&R[k].render(true))};\n  const mk=(k,items,wrap,label)=>Reel(els[k],{items,wrap,label,dim:dimf(k),onTick:()=>{ra();hk.move&&hk.move()},onSettle:()=>{ra();check()}});\n  R.h=mk('h',Array.from({length:12},(_,i)=>String(i+1)),true,'hour');\n  R.m=mk('m',Array.from({length:12},(_,i)=>String(i*5).padStart(2,'0')),true,'minute');\n  R.p=mk('p',['am','pm'],false,'am or pm');\n  const idle=()=>R.h.mode==='idle'&&R.m.mode==='idle'&&R.p.mode==='idle';\n  const cur=()=>toM(R.h.idx(),R.m.idx(),R.p.idx());\n  function nearest(c){\n    for(let s=5;s<=720;s+=5)for(const sg of [1,-1]){const m=((c+sg*s)%1440+1440)%1440;if(D.allowed(tg,m).ok)return m}\n    return c;\n  }\n  function setMin(M,anim){\n    M=((Math.round(M/5)*5)%1440+1440)%1440;const h24=Math.floor(M/60);\n    R.h.to(((h24%12)||12)-1,!anim);R.m.to((M%60)/5,!anim);R.p.to(h24>=12?1:0,!anim);\n    ['h','m','p'].forEach(k=>R[k].render(true));\n  }\n  function check(){\n    if(!idle()||!tg)return;\n    hk.move&&hk.move();\n    const a=D.allowed(tg,cur());if(a.ok)return;\n    const w=a.why||'';hk.note&&hk.note(/sleep/.test(w)?'sleep hours':/soon/.test(w)?'too soon':w);\n    GL.hap('soft');setMin(nearest(cur()),true);\n  }\n  return {R,cur,idle,\n    setTarget(t,anim){tg=t;let m=t.defaultMin;if(!D.allowed(t,m).ok)m=nearest(m);setMin(m,anim)},\n    ok(){return !!tg&&idle()&&D.allowed(tg,cur()).ok},\n    liveOk(){return !!tg&&D.allowed(tg,cur()).ok}};\n}\n\n/* press and hold. cb: start, prog(p), cancel(p), done() */\nfunction holdOn(el,ms,cb){\n  let down=false,t0=0,raf=0,p=0,fired=0;\n  function lp(){\n    if(!down)return;\n    p=Math.min( ont-family:var(--rnd);font-weight:800;color:#1B1B1D}\n.fin .fd{height:40px;padding:0 15px;border-radius:20px;background:#1B1B1D;color:#F2F2F0;font-size:17px;display:flex;align-items:center;font-style:normal}\n.fin .ft{font-size:calc(var(--rf)*1.08);letter-spacing:-.03em;line-height:1}\n.fin .fa{font-size:calc(var(--rf2)*1.1);font-style:normal}\n.fin.big .ft{font-size:calc(var(--rf)*1.3)}\n/* chips under the card */\n#chips{height:40px;transition:opacity .25s linear}\n#mu.time #chips{opacity:0;pointer-events:none}\n/* bottom row */\n#bot{display:flex;align-items:flex-start;gap:12px;margin:0 22px;height:56px;position:relative}\n.side{position:relative;flex:none;width:72px;height:56px;display:flex;flex-direction:column;align-items:center;transition:opacity .25s linear,transform .3s var(--ease)}\n.side.sp{pointer-events:none}\n#mu.time .side{opacity:0;pointer-events:none;transform:translateY(8px)}\n.circ{position:relative;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#F5F5F5;touch-action:none;transition:transform .14s var(--ease)}\n.circ:active{transform:scale(.95)}\n.circ svg.rg{position:absolute;inset:0;width:56px;height:56px;transform:rotate(-90deg)}\n.circ svg.rg circle{fill:none;stroke:#F5F5F5;stroke-width:3;stroke-linecap:round}\n.side .sl{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:rgba(255,255,255,.62);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px}\n.side .sl .pp i{width:6px;height:6px;border-width:1.2px}\n#cta{flex:1;min-width:0}\n#cta .a1,#cta .a2{display:flex;align-items:center;gap:8px;transition:opacity .22s linear}\n#cta .a2{position:absolute;opacity:0}\n#mu.time #cta .a1{opacity:0}#mu.time #cta .a2{opacity:1}\n/* confirm */\n#mu.cf #muH,#mu.cf #chips,#mu.cf #bot,#mu.cf .wwk{opacity:0!important;pointer-events:none;transition:opacity .22s linear}\n#mu.cf .dayR,#mu.cf .tmw{opacity:0!important;pointer-events:none}\n#mu.cf .fin{opacity:1}\n.win.dim .wm{opacity:.8}\n@media (max-height:700px){\n  #mu.B{--rh:46px;--rf:40px;--rf2:19px;--rw:52px;--wh:128px;padding-bottom:calc(54px + env(safe-area-inset-bottom))}\n  .pol{padding:10px 10px 2px}\n  .wl{font-size:13px}.wwk{gap:5px;left:10px;top:10px}\n  #dchip{height:38px;min-width:48px;font-size:15px;margin-right:4px}\n  .wbig{margin:-50px 0 0 -42px;width:84px;height:98px}\n  .side .sl{font-size:10px}\n}\n@media (min-height:900px){#mu.B{--rh:70px;--rf:58px;--rf2:28px;--rw:78px;--wh:230px}.pol{width:min(340px,calc(100vw - 56px))}}\n\n#rh .rw{justify-content:flex-end}#rm .rw{justify-content:flex-start}\n.tmw .reel:not(.ap){width:calc(var(--rf)*1.35)}.tmw #rh{width:calc(var(--rf)*1.3)}\n.side{transition:opacity .25s linear,transform .3s var(--ease),width .3s var(--ease),margin .3s var(--ease)}\n#mu.time .side{width:0;margin:0 -6px}\n.wm .blob{background:radial-gradient(circle,rgba(220,220,220,.34) 0%,rgba(210,210,210,.13) 38%,rgba(210,210,210,0) 68%)}\n.wlab{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,.34);transition:opacity .3s}\n.win.none .wlab{display:none}\n\n.mg:before{content:\"\";position:absolute;left:6px;right:6px;top:50%;height:var(--rh);margin-top:calc(var(--rh)/-2);border-radius:16px;background:rgba(27,27,29,.07)}\n.dayR .rw{font-size:calc(var(--rf)*1.25)}\n<\/style><\/head>\n<body>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs><linearGradient id=\"fg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#D82713\"/><stop offset=\".5\" stop-color=\"#FF7300\"/><stop offset=\"1\" stop-color=\"#FFC42E\"/><\/linearGradient><\/defs><\/svg>\n<div id=\"app\">\n  <div id=\"media\"><div id=\"kb\"><div class=\"blob\" id=\"b1\"><\/div><div class=\"blob\" id=\"b2\"><\/div><div id=\"horizon\"><\/div><\/div><div id=\"vig\"><\/div><div id=\"shade\"><\/div><div id=\"label\"><\/div><\/div>\n  <div id=\"prog\"><div id=\"fill\"><\/div><\/div>\n  <div id=\"meta\"><\/div>\n  <div id=\"stage\"><\/div>\n  <div id=\"fine\">close to keep going. no wait.<\/div>\n  <button id=\"timer\" aria-label=\"continue, after 30 seconds\"><span id=\"tfill\"><\/span><span id=\"tlab\">0:30<\/span><\/button>\n  <div id=\"mu\"><\/div>\n  <div id=\"end\"><\/div>\n  <button id=\"snd\" aria-label=\"sound\"><i><\/i><\/button>\n  <button id=\"x\" aria-label=\"close, keep going\"><i><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M2 2l10 10M12 2L2 12\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg><\/i><\/button>\n<\/div>\n<script>/* GymLock \u00b7 \"plans changed\" pause \u00b7 shared engine for all 4 variants.\n   Owns: demo scenario, the copy (lines + choices), reading pace, the 30 s clock, demo haptic log.\n   Variants own only the look and motion. Do not edit this file from a variant. */\n(function () {\n  const WAIT = 30;\n\n  /* ---------------- scenario (stands in for real app data) ---------------- */\n  const DEFAULT = {\n    ctx: 'wake',          // 'wake' just woke (window open) | 'trip' on the way | 'closed' window ran out\n    visits: 23,           // gym visits so far (GymVisitTracker); day N of 66 counts these\n    lastMissed: false,    // last planned session was skipped\n    weekDone: 1, weekGoal: 3, plannedLeft: 3, // plannedLeft includes today (SkipRules.chancesRemaining)\n    reason: 'laterToday', // OnboardingProfile.failureReasons first pick, or 'none'\n    gymBy: '7:05', now: '6:41', etaMin: 12, graceMin: 10,\n    homeLeft: 2, homeMin: 25,\n    day0: 'video',        // Day0Media kind: 'video' | 'photo' | 'none'\n    day0Date: 'sep 12',\n    streakWeeks: 6,       // week streak (StreakChip number)\n    alarmAt: '6:30', date: 'tue nov 24'\n  };\n  let cfg = Object.assign({}, DEFAULT);\n\n  /* ---------------- reading pace ----------------\n     Adults read about 238 words a minute silently (Brysbaert, 2019). Just after waking, sleep inertia\n     slows thinking (Hilditch, 2019), so we pace for 150 wpm = 2.5 words a second, plus time to notice\n     the line and a dwell before the next one. */\n  const WPS = 2.5, NOTICE = 0.5, DWELL = 1.1, MIN_LINE = 2.4, START = 0.7;\n  const words = s => s.trim().split(/\\s+/).length;\n  const lineDuration = s => Math.max(MIN_LINE, NOTICE + words(s) / WPS + DWELL);\n\n  /* ---------------- the copy ---------------- */\n  const OWN = {\n    laterToday: '\"i tell myself i\\'ll go later.\"',\n    scrolling: '\"i start scrolling.\"',\n    exhausted: '\"i\\'m exhausted.\"',\n    scheduleChanges: '\"my schedule changes.\"'\n  };\n  const OWN_AFTER = {\n    laterToday: 'this is that sentence, happening.',\n    scrolling: 'skip, and the apps open. that is the trade.',\n    exhausted: '10 easy minutes lifts energy. today can be a light one.',\n    scheduleChanges: (c) => `if it really did, ${c.homeMin} minutes at home still counts.`\n  };\n  function stage(c) {\n    if (c.visits < 10) return 'new';\n    if (c.visits < 40) return 'building';\n    if (c.visits < 66) return 'close';\n    return 'habit';\n  }\n  function weekReachableWithoutToday(c) { return c.weekDone + (c.plannedLeft - 1) >= c.weekGoal; }\n\n  /* Returns the lines for the 30 s, in order, each with its start time and duration.\n     kind: 'ground' | 'own' | 'quote' | 'stake' | 'fact' | 'close'. A fact carries src. */\n  function lines(c = cfg) {\n    const L = [];\n    const add = (p, kind, text, extra) => L.push(Object.assign({ p, kind, text }, extra || {}));\n\n    // 1. where you are right now\n    if (c.ctx === 'wake') add(1, 'ground', 'you beat the alarm. the rest is shoes and a door.');\n    if (c.ctx === 'trip') add(1, 'ground', `you're ${c.etaMin} minutes from the gym.`);\n    if (c.ctx === 'closed') add(1, 'ground', `gym time was ${c.gymBy}. it is ${c.now} now.`);\n\n    // 2. their own words from day 0\n    if (OWN[c.reason]) {\n      add(2, 'own', 'on day 0 you told us why you miss:');\n      add(2, 'quote', OWN[c.reason]);\n      const after = OWN_AFTER[c.reason];\n      add(2, 'own', typeof after === 'function' ? after(c) : after);\n    }\n\n    // 3. the stakes, from real numbers\n    if (c.lastMissed) add(3, 'stake', 'last time was a skip too. two in a row is where habits slip.');\n    else if (!weekReachableWithoutToday(c)) add(3, 'stake', `skip today and ${c.weekGoal} this week is out of reach.`);\n    else add(6, 'stake', `today would make it ${c.weekDone + 1} of ${c.weekGoal} this week.`);\n\n    // 4. one concrete fact for where they are in the habit\n    const s = stage(c);\n    if (s === 'new') add(4, 'fact', 'people expect a workout to feel worse than it does. they only picture the first minutes.', { src: 'ruby et al., 2011' });\n    if (s === 'building') add(4, 'fact', `every visit makes the next one take less effort. you have ${c.visits} behind you.`, { src: 'lally et al., 2010' });\n    if (s === 'close') add(4, 'fact', `${66 - c.visits} more visits and going stops being a decision.`, { src: 'lally et al., 2010' });\n    if (s === 'habit') add(4, 'fact', `${c.visits} visits. one more keeps it automatic.`, { src: 'lally et al., 2010' });\n\n    // 5. the way forward\n    if (c.ctx === 'closed') add(5, 'close', `go now and you get ${c.graceMin} more minutes.`);\n    else add(5, 'close', `gym by ${c.gymBy}. you can still make it.`);\n\n    // fit into 30 s by reading pace: drop the lowest priority until it fits\n    let fitted = L.slice();\n    const total = arr => START + arr.reduce((a, l) => a + lineDuration(l.text), 0);\n    while (total(fitted) > WAIT - 0.4 && fitted.length > 1) {\n      const worst = fitted.reduce((w, l) => (l.p > w.p ? l : w), fitted[0]);\n      // own words travel as a block of three: drop the whole block or none\n      fitted = worst.p === 2 ? fitted.filter(l => l.p !== 2) : fitted.filter(l => l !== worst);\n    }\n    let t = START;\n    return fitted.map(l => { const d = lineDuration(l.text); const o = Object.assign({}, l, { t, d, words: words(l.text) }); t += d; return o; });\n  }\n\n  /* ---------------- the three choices, in order ---------------- */\n  function choices(c = cfg) {\n    const list = [];\n    list.push({\n      key: 'gym', title: 'still going', icon: 'shoe',\n      lead: c.ctx === 'closed' ? `${c.graceMin} more minutes. not a new window.` : `gym by ${c.gymBy}.`,\n      perks: [`visit ${c.visits + 1} of 66`, `this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'apps unlock when you arrive'],\n      primary: \"i'm going\", secondary: 'not this'\n    });\n    if (c.homeLeft > 0) list.push({\n      key: 'home', title: 'quick workout instead', icon: 'house',\n      lead: `${c.homeMin} minutes at home counts as a full day.`,\n      perks: [`this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'checked by apple health or a photo', `${c.homeLeft} of 3 left this month`],\n      primary: `start ${c.homeMin} minutes`, secondary: 'not this either'\n    });\n    const reachable = weekReachableWithoutToday(c);\n    list.push({\n      key: 'cant', title: \"can't today\", icon: 'calendar',\n      lead: reachable ? `no problem. you need ${c.weekGoal - c.weekDone} more this week.` : 'make it up. this keeps your streak.',\n      perks: [`one skip won't undo ${c.visits} visits`, 'next, pick a day to make it up'],\n      primary: \"can't today\", secondary: 'back to the gym'\n    });\n    return list;\n  }\n\n  /* ---------------- receipt rows (for the printer variant; any variant may use) ---------------- */\n  function receipt(c = cfg) {\n    const rows = [\n      ['gym by', c.gymBy],\n      ['this visit', `${c.visits + 1} of 66`],\n      ['this week', `${c.weekDone} of ${c.weekGoal}`],\n    ];\n    if (c.lastMissed) rows.push(['last time', 'skipped']);\n    if (c.homeLeft >= 0) rows.push(['home workouts', `${c.homeLeft} of 3 left`]);\n    return {\n      rows,\n      said: OWN[c.reason] || null,\n      ifGo: `${c.weekDone + 1} of ${c.weekGoal}`,\n      ifSkip: `${c.weekGoal - c.weekDone} still to do`\n    };\n  }\n\n  /* ---------------- this week as 7 days (Mon first) ----------------\n     state: 'done' | 'today' | 'planned' | 'rest'. Today is Tuesday in the demo. */\n  function week(c = cfg) {\n    const names = ['m', 't', 'w', 't', 'f', 's', 's'];\n    const st = ['done', 'today', 'rest', 'rest', 'rest', 'rest', 'rest'];\n    const later = [3, 5, 4, 6];               // thu, sat, then fri, sun if more are planned\n    for (let i = 0; i < Math.max(0, c.plannedLeft - 1); i++) st[later[i]] = 'planned';\n    return names.map((n, i) => ({ n, state: st[i] }));\n  }\n\n  /* ---------------- the wait button label ---------------- */\n  function timerLabel(elapsed) {\n    const left = Math.max(0, Math.ceil(WAIT - elapsed));\n    return left > 0 ? `0:${String(left).padStart(2, '0')}` : 'continue';\n  }\n\n  /* ---------------- the 30 s clock ---------------- */\n  let t0 = performance.now(), offset = 0;\n  const restartCbs = [];\n  function clock() { return Math.min(WAIT + 600, (performance.now() - t0) / 1000 + offset); }\n  function restart() { t0 = performance.now(); offset = 0; restartCbs.forEach(f => f(cfg)); }\n  function skip() { offset = Math.max(offset, WAIT - (performance.now() - t0) / 1000); }\n  function onRestart(f) { restartCbs.push(f); }\n\n  /* ---------------- demo haptic log (real app: UIImpactFeedbackGenerator) ----------------\n     kinds: 'light' (printer tick), 'soft' (a line lands), 'rigid' (choice changes),\n            'medium' (the 30 s is up), 'heavy' (commit: i'm going / start). */\n  let lastHap = 0;\n  function hap(kind) {\n    const now = performance.now();\n    if (kind === 'light' && now - lastHap < 70) return; // rate limit, as WakeHaptics does\n    lastHap = now;\n    try { parent.postMessage({ gl: 'hap', kind }, '*'); } catch (e) {}\n  }\n  function done(what) { try { parent.postMessage({ gl: 'done', what }, '*'); } catch (e) {} }\n\n  window.addEventListener('message', e => {\n    const m = e.data || {};\n    if (m.gl === 'config') { cfg = Object.assign({}, DEFAULT, m.cfg); restart(); }\n    if (m.gl === 'skip') skip();\n    if (m.gl === 'restart') restart();\n  });\n\n  window.GL = { week, timerLabel, WAIT, DEFAULT, get cfg() { return cfg; }, lines, choices, receipt, stage, lineDuration, clock, restart, skip, onRestart, hap, done };\n})();\n<\/script>\n<script>/* GymLock \u00b7 \"can't today\" one screen \u00b7 shared DATA only (no look).\n   Every variant reads MU.data() after the approved pause ends. Real app: SkipRules.screen,\n   ReschedulePlanner.choices / defaultTime / isTimeAvailable, HomeWorkoutRules, streak.\n   Do not edit from a variant. */\n(function () {\n  const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];\n  const FULL = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];\n  const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };\n  // display: 12 h, lowercase, no leading zero: \"6:30 am\"\n  const fmt = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; const h12 = h % 12 || 12; return { h: h12, m: String(mm).padStart(2, '0'), ap: h < 12 ? 'am' : 'pm', text: `${h12}:${String(mm).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}` }; };\n\n  function data(c = GL.cfg) {\n    const sleepStart = toMin(c.sleepStart || '22:30'), sleepEnd = toMin(c.sleepEnd || '5:30');\n    const nowMin = toMin(c.now);\n    const usual = toMin(c.alarmAt);\n    const reachable = c.weekDone + (c.plannedLeft - 1) >= c.weekGoal;\n    const need = c.weekGoal - c.weekDone;\n    const wk = GL.week(c);                       // 7 days, mon first: done | today | planned | rest\n    const ti = wk.findIndex(d => d.state === 'today');\n    const earliestToday = Math.ceil((nowMin + 30) / 15) * 15;   // at least 30 min from now\n    const inSleep = m => sleepStart > sleepEnd ? (m >= sleepStart || m < sleepEnd) : (m >= sleepStart && m < sleepEnd);\n\n    // targets you can move today's workout to: later today + days left this week that aren't planned\n    const targets = [];\n    if (earliestToday < sleepStart) targets.push({ key: 'today', idx: ti, short: 'today', name: 'later today', isToday: true, defaultMin: earliestToday });\n    wk.forEach((d, i) => { if (i > ti && d.state === 'rest') targets.push({ key: DAYS[i], idx: i, short: DAYS[i], name: FULL[i], isToday: false, defaultMin: usual }); });\n\n    function allowed(t, m) {\n      m = ((m % 1440) + 1440) % 1440;\n      if (inSleep(m)) return { ok: false, why: 'inside your sleep hours' };\n      if (t.isToday && m < earliestToday) return { ok: false, why: 'too soon' };\n      return { ok: true };\n    }\n\n    // what skipping costs, from real numbers. Empty when it costs nothing.\n    const cost = [];\n    if (!reachable) cost.push({ k: 'week', big: `${c.weekDone}/${c.weekGoal}`, text: `${c.weekGoal} this week out of reach` });\n    if (c.lastMissed) cost.push({ k: 'row', big: '2\u00d7', text: 'second skip in a row' });\n    if (!reachable && c.streakWeeks > 0) cost.push({ k: 'streak', big: String(c.streakWeeks), text: `${c.streakWeeks}-week streak at risk`, hot: true });\n\n    return {\n      heading: reachable ? `no problem. you need ${need} more this week.` : 'make it up. this keeps your streak.', // exact FLOW copy\n      reachable, need, weekDone: c.weekDone, weekGoal: c.weekGoal, streakWeeks: c.streakWeeks,\n      week: wk, todayIdx: ti, days: DAYS, targets, usualMin: usual, nowMin, sleepStart, sleepEnd,\n      allowed, fmt, cost,\n      home: c.homeLeft > 0 ? { minutes: c.homeMin, left: c.homeLeft, of: 3 } : null,\n      // FLOW order: week at risk -> reschedule first, home, skip last (hold).\n      //             week fine    -> skip first (plain tap), reschedule, home.\n      order: reachable ? ['skip', 'reschedule', 'home'] : ['reschedule', 'home', 'skip'],\n      skipNeedsHold: !reachable  // hold only when skipping loses the week; then skip is last (FLOW)\n    };\n  }\n  window.MU = { data, fmt, toMin };\n})();\n<\/script>\n<script>\n(function(){\nconst $=id=>document.getElementById(id);\nconst RM=matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst ease=p=>1-Math.pow(1-p,3);\nconst prog=(lt,a,d)=>clamp((lt-a)/d,0,1);\nlet S;\nfunction esc(s){return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;')}\nconst SPK='<svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M2 6h3l4-3v10L5 10H2z\" fill=\"#fff\"/>',\n MUTE=SPK+'<path d=\"M11.5 5.5l3 5M14.5 5.5l-3 5\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\/svg>',\n LOUD=SPK+'<path d=\"M11.5 5.5q2 2.5 0 5M13.3 3.8q3.6 4.2 0 8.4\" stroke=\"#fff\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><\/svg>';\n\n/* ---------- icons (2pt line, round caps) ---------- */\nconst IC={\n bell:'<path d=\"M12 3.5a6 6 0 0 0-6 6V14l-1.6 2.6h15.2L18 14V9.5a6 6 0 0 0-6-6z\"/><path d=\"M10 19.5a2 2 0 0 0 4 0\"/>',\n sunrise:'<path d=\"M3 18.5h18\"/><path d=\"M7 18.5a5 5 0 0 1 10 0\"/><path d=\"M12 6.5v2.6M4.8 10.6l1.8 1.8M19.2 10.6l-1.8 1.8\"/>',\n dumbbell:'<path d=\"M6.5 7.5v9M17.5 7.5v9M3.5 10v4M20.5 10v4M6.5 12h11\"/>',\n house:'<path d=\"M3.5 11.2L12 4l8.5 7.2\"/><path d=\"M5.8 9.6V20h12.4V9.6\"/><path d=\"M10 20v-5.4h4V20\"/>'\n};\nfunction ic(n,s){return '<svg class=\"ic\" width=\"'+s+'\" height=\"'+s+'\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">'+IC[n]+'<\/svg>'}\n\n/* ---------- the app's flame (flame.fill shape) ---------- */\nconst FP='M13 1C14.6 5.6 19.6 9 19.8 16C20 21.6 16.6 26.6 12 26.6C7.4 26.6 4 22.6 4.2 17C4.3 13.6 6 11 7.8 9.2C8 11 8.8 12 9.8 12.4C9 8 10.4 4.2 13 1Z M12 24.2C9.9 24.2 8.6 22.6 8.6 20.8C8.6 18.6 10.5 17.4 11.4 15.6C11.7 16.8 12.6 17.2 13.4 18C14.2 18.8 15.4 19.4 15.4 20.8C15.4 22.6 14.1 24.2 12 24.2Z';\nfunction flame(w,h,lit){\n  const d=document.createElement('div');d.className='fl';d.style.width=w+'px';d.style.height=h+'px';\n  d.innerHTML='<svg class=\"fo ic\" viewBox=\"0 0 24 28\" aria-hidden=\"true\"><path d=\"'+FP+'\" fill-rule=\"evenodd\" style=\"vector-effect:non-scaling-stroke\"/><\/svg><svg class=\"ff\" viewBox=\"0 0 24 28\" aria-hidden=\"true\"><path d=\"'+FP+'\" fill-rule=\"evenodd\" fill=\"url(#fg)\"/><\/svg>';\n  d.ff=d.querySelector('.ff');d.fo=d.querySelector('.fo');\n  if(lit)setLit(d,1);\n  return d;\n}\nfunction setLit(f,p){f.ff.style.opacity=p;f.fo.style.opacity=1-p}\nfunction weekRow(w,h,gap,opts){\n  const c=GL.cfg,g=c.weekGoal,d=c.weekDone;const row=document.createElement('div');row.className='wrow';row.fl=[];\n  for(let k=0;k<g;k++){\n    if(k>0){const cn=document.createElement('div');cn.className='conn'+(k<=d-1?' on':'');cn.style.width=gap+'px';row.appendChild(cn)}\n    const f=flame(w,h,k<d);\n    if(k===d&&opts&&opts.today){f.classList.add(opts.today)}\n    if(k===d&&opts&&opts.label){const l=document.createElement('div');l.className='tdl';l.textContent='today';f.appendChild(l)}\n    row.appendChild(f);row.fl.push(f);\n  }\n  row.todayFl=row.fl[d]||null;\n  return row;\n}\n\n/* ---------- beats ---------- */\nfunction mkBeat(id,aria){const el=document.createElement('div');el.className='beat';el.setAttribute('role','group');el.setAttribute('aria-label',aria);$('stage').appendChild(el);return {id,el,aria,fired:{}}}\nfunction capEl(b,text,src){\n  const c=document.createElement('div');c.className='bcap';c.textContent=text;b.el.appendChild(c);b.cap=c;\n  if(src){const s=document.createElement('div');s.className='bsrc';s.textContent=src;b.el.appendChild(s);b.src=s}\n}\nfunction fire(b,k,lt,at,kind){if(!b.fired[k]&&lt>=at){b.fired[k]=1;GL.hap(kind)}}\n\nfunction bGround(L){\n  const c=GL.cfg,b=mkBeat('ground',L.text);\n  const W=Math.min(334,innerWidth-56),R=36,cx=[R,W/2,W-R];\n  const frac=c.ctx==='trip'?.86:.5, a2=cx[1]+R, b2=cx[2]-R, x2=a2+(b2-a2)*frac;\n  const gl=c.ctx==='closed'?c.gymBy+' \\u00B7 '+c.now+' now':'gym by '+c.gymBy;\n  const w=document.createElement('div');w.className='gr';w.style.width=W+'px';\n  const tk=(id,x)=>'<g id=\"'+id+'\" transform=\"translate('+(x+25)+' 11)\" opacity=\"0\"><circle r=\"11\" fill=\"#fff\"/><path d=\"M-5 .5L-1.5 4L5.5-3.5\" pathLength=\"1\" stroke=\"#0B0B0C\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"1\" stroke-dashoffset=\"1\"/><\/g>';\n  w.innerHTML=\n   '<div class=\"nd\" style=\"left:'+(cx[0]-R)+'px\">'+ic('bell',36)+'<\/div><div class=\"nl\" style=\"left:'+cx[0]+'px\">'+esc(c.alarmAt)+'<\/div>'+\n   '<div class=\"nd\" style=\"left:'+(cx[1]-R)+'px\">'+ic('sunrise',36)+'<\/div><div class=\"nl\" style=\"left:'+cx[1]+'px\">up<\/div>'+\n   '<div class=\"nd off\" style=\"left:'+(cx[2]-R)+'px\">'+ic('dumbbell',36)+'<\/div><div class=\"nl\" style=\"left:'+cx[2]+'px;'+(c.ctx==='closed'?'color:#fff':'')+'\">'+esc(gl)+'<\/div>'+\n   '<svg class=\"ov\" width=\"'+W+'\" height=\"80\" viewBox=\"0 0 '+W+' 80\" fill=\"none\" aria-hidden=\"true\">'+\n   '<path d=\"M'+a2+' 36H'+b2+'\" stroke=\"rgba(255,255,255,.2)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 5\"/>'+\n   '<path id=\"s1\" d=\"M'+(cx[0]+R)+' 36H'+(cx[1]-R)+'\" pathLength=\"1\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1\" stroke-dashoffset=\"1\"/>'+\n   '<path id=\"s2\" d=\"M'+a2+' 36H'+x2+'\" pathLength=\"1\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1\" stroke-dashoffset=\"1\"/>'+\n   '<circle id=\"ring\" cx=\"'+x2+'\" cy=\"36\" r=\"5\" stroke=\"#fff\" stroke-width=\"1.5\" opacity=\"0\"/><circle id=\"dot\" cx=\"'+x2+'\" cy=\"36\" r=\"5\" fill=\"#fff\" opacity=\"0\"/>'+\n   tk('t1',cx[0])+tk('t2',cx[1])+'<\/svg>';\n  b.el.appendChild(w);\n  capEl(b,c.ctx==='trip'?'almost there.':'two of three done.');\n  const q=s=>w.querySelector(s);\n  const s1=q('#s1'),s2=q('#s2'),t1=q('#t1'),t2=q('#t2'),dot=q('#dot'),ring=q('#ring');\n  const tick=(g,lt,a)=>{const p=prog(lt,a,.25);g.setAttribute('opacity',p>0?1:0);g.setAttribute('transform',g.getAttribute('transform').replace(/ scale\\([^)]*\\)/,'')+' scale('+(.6+.4*ease(p))+')');g.lastChild.setAttribute('stroke-dashoffset',1-prog(lt,a+.15,.3))};\n  b.update=lt=>{\n    tick(t1,lt,.45);fire(b,'a',lt,.45,'light');\n    s1.setAttribute('stroke-dashoffset',1-ease(prog(lt,.85,.4)));\n    tick(t2,lt,1.3);fire(b,'b',lt,1.3,'light');\n    s2.setAttribute('stroke-dashoffset',1-ease(prog(lt,1.8,.8)));\n    const dp=prog(lt,2.5,.2);dot.setAttribute('opacity',dp);\n    const pz=RM||lt<2.5?0:((lt-2.5)%1.4)/1.4;ring.setAttribute('r',5+8*pz);ring.setAttribute('opacity',dp*(1-pz)*.6);\n    b.cap.style.opacity=prog(lt,1.9,.4);\n  };\n  return b;\n}\n\nfunction bOwn(Ls){\n  const q=Ls.find(l=>l.kind==='quote');\n  const b=mkBeat('own',Ls.map(l=>l.text).join(' '));\n  const txt=q.text.replace(/^[\"\u201c]|[\"\u201d]$/g,'');\n  b.el.innerHTML='<div class=\"qlab\">you, on day 0<\/div><div class=\"qm\" aria-hidden=\"true\">\u201c<\/div><div class=\"qt\"><\/div><div class=\"qm qm2\" aria-hidden=\"true\" style=\"height:30px;line-height:.9\">\u201d<\/div>';\n  const qt=b.el.querySelector('.qt');\n  const ws=txt.split(/\\s+/).map((w,k,a)=>{const s=document.createElement('span');s.className='w';s.textContent=w;qt.appendChild(s);if(k<a.length-1)qt.appendChild(document.createTextNode(' '));return s});\n  const lab=b.el.querySelector('.qlab'),m1=b.el.children[1],m2=b.el.children[3];\n  m2.style.opacity=0;\n  b.update=lt=>{\n    lab.style.opacity=prog(lt,.1,.4);\n    m1.style.opacity=prog(lt,.1,.5);m1.style.transform=RM?'none':'scale('+(.85+.15*ease(prog(lt,.1,.5)))+')';\n    ws.forEach((w,i)=>{const p=prog(lt,.45+i*.14,.3);w.style.opacity=p;w.style.transform=RM?'none':'translateY('+(1-ease(p))*6+'px)'});\n    m2.style.opacity=prog(lt,.45+ws.length*.14,.4);\n  };\n  return b;\n}\n\nfunction bStake(L){\n  const c=GL.cfg,b0=c.weekDone+c.plannedLeft-1<c.weekGoal;\n  const weak=c.lastMissed||b0;\n  const capT=c.lastMissed?'two in a row cools it.':b0?'skip and the week is out.':'today keeps the flame.';\n  const wk=c.streakWeeks===1?'week':'weeks';\n  const b=mkBeat('stake',(L?L.text:capT)+' '+c.streakWeeks+' '+wk+' streak.');\n  const sk=document.createElement('div');sk.className='sk';\n  const big=flame(84,98,true);\n  const nb=document.createElement('div');nb.innerHTML='<div class=\"num rnd\">'+c.streakWeeks+'<\/div><div class=\"unit\">'+wk+'<\/div>';\n  sk.appendChild(big);sk.appendChild(nb);b.el.appendChild(sk);\n  const row=weekRow(34,40,26,{label:1});row.style.marginTop='34px';b.el.appendChild(row);\n  const today=row.todayFl;\n  capEl(b,capT);\n  b.update=lt=>{\n    // big flame weakens for a second, then recovers\n    let w=0;if(weak)w=RM?.7:prog(lt,.5,.4)*(1-prog(lt,1.8,.7));\n    big.style.transform='scale('+(1-.08*w)+')';\n    big.style.filter='saturate('+(1-.4*w)+')';\n    // today flame flickers toward lit, then falls back\n    if(today){\n      const env=Math.sin(Math.PI*prog(lt,.6,1.3));\n      const nz=RM?1:(.62+.38*Math.abs(Math.sin(lt*31)*Math.sin(lt*17+1)));\n      setLit(today,clamp(env*.85*nz,0,1));\n      fire(b,'l',lt,1.05,'light');\n      const br=lt>1.9?(Math.sin((lt-1.9)*2.6)+1)/2:0;\n      today.style.transform=RM?'none':'scale('+(1+.05*br)+')';\n      today.style.opacity=lt>1.9?.65+.35*br:1;\n    }\n    b.cap.style.opacity=prog(lt,.9,.4);\n  };\n  return b;\n}\n\nfunction bFact(L){\n  const c=GL.cfg,st=GL.stage(c),v=c.visits;\n  const capT={new:'the first minutes are the worst.',building:'each visit gets easier.',close:(66-v)+' more and it\u2019s automatic.',habit:'one more keeps it automatic.'}[st];\n  const srcT=L&&L.src?L.src:(st==='new'?'ruby et al., 2011':'lally et al., 2010');\n  const b=mkBeat('fact',L?L.text:capT);\n  const h=document.createElement('div');h.className='f66';\n  h.innerHTML='<span class=\"num rnd\">'+(st==='habit'?v:v+1)+'<\/span><span class=\"of\">'+(st==='habit'?'visits':'of 66')+'<\/span>';\n  b.el.appendChild(h);\n  const g=document.createElement('div');g.className='dots';g.setAttribute('aria-hidden','true');\n  const ds=[];for(let i=0;i<66;i++){const d=document.createElement('i');if(i===v&&v<66)d.className='nx';g.appendChild(d);ds.push(d)}\n  b.el.appendChild(g);capEl(b,capT,srcT);\n  const step=Math.min(.03,1.1/Math.max(1,v));\n  b.update=lt=>{\n    for(let i=0;i<Math.min(v,66);i++){const p=prog(lt,.3+i*step,.2);ds[i].style.background='rgba(255,255,255,'+(.16+.84*p)+')'}\n    const nx=ds[v];if(nx&&v<66){const a=prog(lt,.3+v*step+.2,.3);nx.style.opacity=a;const pp=RM?0:Math.sin(Math.PI*prog(lt,1.7,.9));nx.style.transform='scale('+(1+.55*pp)+')'}\n    b.cap.style.opacity=prog(lt,1.0,.4);if(b.src)b.src.style.opacity=prog(lt,1.5,.4);\n  };\n  return b;\n}\n\nfunction bClose(L){\n  const c=GL.cfg,closed=c.ctx==='closed';\n  const b=mkBeat('close',L.text);\n  b.el.innerHTML='<div class=\"ic\" style=\"color:#fff\">'+ic('dumbbell',56)+'<\/div>'+\n   (closed?'<div class=\"big rnd\">+'+c.graceMin+'<\/div><div class=\"bigl\">min<\/div>':'<div class=\"bigl\" style=\"margin-top:20px\">gym by<\/div><div class=\"big rnd\" style=\"margin-top:6px\">'+esc(c.gymBy)+'<\/div>');\n  capEl(b,closed?'if you go now.':'you can still make it.');\n  const kids=[b.el.children[0],b.el.children[1],b.el.children[2]];\n  b.update=lt=>{kids.forEach((k,i)=>{k.style.opacity=prog(lt,i*.2,.4)});b.cap.style.opacity=prog(lt,.9,.4)};\n  return b;\n}\n\nfunction mkBeats(){\n  const L=GL.lines(),by=k=>L.find(l=>l.kind===k);\n  const g=by('ground'),q=by('quote'),st=by('stake'),f=by('fact'),cl=by('close');\n  const B=[];\n  if(g){const b=bGround(g);b.start=g.t;B.push(b)}\n  if(q){const b=bOwn(L.filter(l=>l.kind==='own'||l.kind==='quote'));b.start=q.t;B.push(b)}\n  // stake: always shown, even when its line was dropped to fit 30 s. Quote keeps >= 4.5 s; the next beat gives way.\n  {\n    let fb=null,cb=null;\n    if(f){fb=bFact(f);fb.start=f.t}\n    if(cl){cb=bClose(cl);cb.start=cl.t}\n    const nxt=fb||cb;\n    const prev=B.length?B[B.length-1]:null;let s;\n    if(st)s=st.t;\n    else{\n      const need=prev?(prev.id==='own'?4.5:3.2):0;\n      s=Math.max((prev?prev.start:0)+need,(nxt?nxt.start:GL.WAIT-3)-4);\n    }\n    const b=bStake(st);b.start=s;B.push(b);\n    if(nxt&&nxt.start<s+3.2)nxt.start=s+3.2;\n    if(fb&&cb&&cb.start<fb.start+2.5)cb.start=fb.start+2.5;\n    if(fb)B.push(fb);if(cb)B.push(cb);\n  }\n  B.sort((a,b)=>a.start-b.start);\n  return B;\n}\n\n\n/* ===== over-the-video layer (video / photo). Their own voice leads; we add only what the video can't say:\n   the streak at stake, minutes left to the gym, and where they are in the 66. One short line at a time, low. ===== */\nconst toM=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+m};\nfunction ltBuild(){\n  const c=GL.cfg,L=GL.lines();let lt=$('lt');\n  if(!lt){lt=document.createElement('div');lt.id='lt';lt.innerHTML='<div id=\"ltcap\"><\/div><div id=\"ltchips\"><\/div>';$('app').insertBefore(lt,$('fine'))}\n  lt.style.opacity=1;\n  const left=Math.max(0,toM(c.gymBy)-toM(c.now)),closed=c.ctx==='closed';\n  const chips=[];\n  if(c.streakWeeks>0)chips.push({k:'stake',html:'<span class=\"fx\"><\/span><b>'+c.streakWeeks+'<\/b><span>'+(c.streakWeeks===1?'week':'weeks')+'<\/span>'});\n  chips.push({k:'close',html:closed?'<b>+'+c.graceMin+'<\/b><span>min if you go now<\/span>':'<b>'+left+'<\/b><span>min to gym<\/span>'});\n  chips.push({k:'fact',html:'<b>'+Math.min(66,c.visits+1)+'<\/b><span>of 66<\/span><i class=\"bar\"><i style=\"width:'+Math.min(100,Math.round(c.visits/66*100))+'%\"><\/i><\/i>'});\n  const box=$('ltchips');box.innerHTML='';\n  S.ltChips=chips.map(ch=>{const e=document.createElement('div');e.className='lc';e.dataset.k=ch.k;e.innerHTML=ch.html;box.appendChild(e);return e});\n  const fx=box.querySelector('.fx');if(fx){const f=flame(15,18,true);fx.replaceWith(f)}\n  const cap=$('ltcap');cap.innerHTML='';\n  S.ltLines=L.map(l=>{\n    const wrap=document.createElement('di en].forEach((b,i)=>{b.style.height=(live&&!RM?3+8*Math.abs(Math.sin(now*(5+i*1.7)+i)):3)+'px'})}\n}\n\n/* ---------- build ---------- */\nfunction build(){\n  const cfg=GL.cfg,mode=cfg.day0;\n  S={mode,phase:'play',cur:-2,idx:0,chs:GL.choices(),frozen:false,busy:false};\n  $('stage').innerHTML='';S.B=mkBeats();\n  $('stage').classList.remove('hide');$('media').classList.remove('dark');\n  ['prog','meta','snd','fine','timer'].forEach(i=>$(i).classList.remove('hide'));\n  $('timer').classList.remove('ready');$('tlab').textContent=GL.timerLabel(0);$('tfill').style.transform='scaleX(0)';\n  muReset();$('end').classList.remove('on');$('end').textContent='';\n  $('fill').style.transform='scaleX(0)';\n  const has=mode==='video'||mode==='photo';\n  $('media').style.display=has?'':'none';\n  $('meta').style.display=has?'':'none';\n  $('meta').textContent='you, on day 0 \u00b7 '+cfg.day0Date;\n  $('snd').style.display=mode==='video'?'':'none';\n  S.muted=true;$('snd').firstChild.innerHTML=MUTE;\n  $('horizon').style.display=mode==='photo'?'block':'none';\n  $('label').style.opacity=1;$('label').textContent=mode==='video'?'your day 0 video plays here':'your day 0 photo';\n  $('app').classList.toggle('vid',has);S.ltLines=null;S.ltCur=-2;\n  if(has){ltBuild();if(mode==='video'){S.muted=false;$('snd').firstChild.innerHTML=LOUD}}\n  else if($('lt'))$('lt').style.opacity=0;\n}\n\nfunction frame(){\n  requestAnimationFrame(frame);\n  if(!S||S.phase==='end'||S.phase==='choices')return;\n  const now=GL.clock(),t=Math.min(now,GL.WAIT);\n  if(S.phase==='play'){\n    $('fill').style.transform='scaleX('+(t/GL.WAIT)+')';\n    $('tfill').style.transform='scaleX('+(t/GL.WAIT)+')';\n    $('tlab').textContent=GL.timerLabel(now);\n    if(S.mode!=='none'){\n      const m=RM?0:1;\n      if(S.mode==='video'){\n        $('b1').style.transform='translate('+(Math.sin(t*.23)*90*m-60)+'px,'+(Math.cos(t*.17)*70*m-120)+'px) scale('+(1+Math.sin(t*.11)*.08*m)+')';\n        $('b2').style.transform='translat eturn;\n    }\n    r.render();\n  };\n  r.springTo=t=>{\n    if(!o.wrap)t=clamp(t,0,n-1);\n    r.tgt=t;r.mode='spring';wake(r);\n  };\n  r.to=(idx,inst)=>{\n    let t=idx;\n    if(o.wrap){const b=Math.round(r.pos),c=((b%n)+n)%n;let d=((idx-c)%n+n)%n;if(d>n/2)d-=n;t=b+d}\n    if(inst){r.pos=t;r.tgt=t;r.vel=0;r.mode='idle';active.delete(r);last=Math.round(r.pos);r.render(true);return}\n    if(t===r.pos&&r.mode==='idle')return;\n    r.springTo(t);\n  };\n  const rubber=raw=>{\n    if(o.wrap)return raw;\n    const over=raw<0?raw:(raw>n-1?raw-(n-1):0);\n    return over?raw-over+rbPx(over*H,H*3)/H:raw;\n  };\n  el.addEventListener('pointerdown',e=>{\n    r.measure();\n    const was=r.mode==='spring';\n    active.delete(r);r.mode='drag';r.vel=0;\n    g={y:e.clientY,pos:r.pos,t:e.timeStamp,moved:0,was,s:[{t:e.timeStamp,y:e.clientY}]};\n    try{el.setPointerCapture(e.pointerId)}catch(_){}\n  });\n  el.addEventListener('pointermove',e=>{\n    if(!g)return;\n    const dy=e.clientY-g.y;g.moved=Math.max(g.moved,Math.abs(dy));\n    r.pos=rubber(g.pos-dy/H);\n    g.s.push({t:e.timeStamp,y:e.clientY});while(g.s.length>2&&e.timeStamp-g.s[0].t>100)g.s.shift();\n    r.render();\n  });\n  const up=e=>{\n    if(!g)return;const q=g;g=null;\n    if(q.moved<6&&e.timeStamp-q.t<400){\n      if(q.was){r.springTo(Math.round(r.pos));return}\n      const rc=el.getBoundingClientRect(),d=Math.round((e.clientY-(rc.top+rc.height/2))/H);\n      r.springTo(Math.round(r.pos)+d);return;\n    }\n    const s=q.s,f=s[0],l=s[s.length-1];let v=0;\n    if(s.length>1&&e.timeStamp-l.t<80&&l.t-f.t>8)v=-((l.y-f.y)/H)/((l.t-f.t)/1000);\n    v=clamp(v,-40,40);\n    const tg=Math.round(r.pos+(RM?0:v*.22));\n    r.vel=v;r.springTo(tg);\n  };\n  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);\n  el.addEventListener('wheel',e=>{\n    e.preventDefault();r.measure();active.delete(r);r.mode='wheel';r.vel=0;\n    r.pos=rubber(r.pos+e.deltaY/(H*1.6));r.render();\n    clearTimeout(wt);wt=setTimeo

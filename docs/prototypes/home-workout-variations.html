<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gymlock home workout prototype v2</title>
<style>
:root{--canvas:#FAF9F6;--surface:#FFFFFF;--muted:#F5F3EF;--ink:#1A1A1A;--ink2:#6B6B6B;--ink3:#999999;--border:#E8E8E8;--coral:#E85D4E;--backdrop:#121213;
--settle:cubic-bezier(.22,.9,.24,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#E9E7E2}
body{font-family:-apple-system,system-ui,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink);padding:16px 0 40px;font-variant-numeric:tabular-nums}
button,select{font-family:inherit;cursor:pointer}
.col{width:min(390px,100%);margin:0 auto;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:#DAD7D0;border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 2px;font-weight:600;font-size:12px;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.ctl label{display:flex;align-items:center;gap:5px;font-weight:500;font-size:12px;color:var(--ink2)}
.ctl select,.ctl .wb{background:#fff;border:0;border-radius:9px;padding:6px 8px;font-weight:500;font-size:12px;color:var(--ink)}
.ctl .tb{background:#222;color:#fff;border:0;border-radius:9px;padding:6px 10px;font-weight:500;font-size:12px}
.ctl .tb.on{box-shadow:0 0 0 2px #E9E7E2,0 0 0 4px #222}
#fit{position:relative;width:100%;margin-top:4px}
#phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:46px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2);transform-origin:0 0;background:var(--backdrop);isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none}
#phone.light{background:var(--canvas)}
#base,#ui,#over{position:absolute;inset:0}
#base{pointer-events:none}
#over{pointer-events:none}
.scrim,.sheet{pointer-events:auto}
.abs{position:absolute}
.hom{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.5);z-index:5;pointer-events:none}
.light .hom{background:rgba(26,26,26,.25)}
.w{color:rgba(255,255,255,.96)}.w2{color:rgba(255,255,255,.64)}
.k{color:var(--ink)}.k2{color:var(--ink2)}
.h{font-weight:800;letter-spacing:-.035em;line-height:1}
.sub{font-size:17px;line-height:22px}
.glass{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.95)}
.light .glass{background:rgba(255,255,255,.6);border:1px solid var(--border);color:var(--ink)}
.topb{position:absolute;top:62px;right:20px;height:44px;min-width:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;padding:0;transition:opacity 220ms ease-in-out;z-index:6}
.topb.end{padding:0 20px}
.topb.off{opacity:0;pointer-events:none}
.btn{position:absolute;left:28px;right:28px;top:746px;height:56px;border-radius:28px;border:0;font-weight:600;font-size:18px;opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity 300ms ease-in-out,transform 550ms var(--settle);z-index:6}
.btn.wh{background:#fff;color:var(--ink)}
.btn.bk{background:var(--ink);color:#fff}
.btn.show{opacity:1;pointer-events:auto;transform:none}
#bfinish.show{transition-delay:700ms}
.grp{position:absolute;inset:0;transition:opacity 420ms ease-in-out,transform 550ms var(--settle)}
#ui[data-s=timer] #gs{transition-duration:200ms,300ms;opacity:0;transform:translateY(-14px);pointer-events:none}
#ui[data-s=timer] #gt{transition-delay:150ms}
#ui[data-s=setup] #gt{opacity:0;transform:translateY(14px);pointer-events:none}
@keyframes eIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
#ui.ent .e{animation:eIn 700ms var(--settle) both;animation-delay:var(--d,0ms)}
.srow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;line-height:22px}
.srow svg{flex:none}
.irow{font-size:15px;line-height:20px}
.subw{position:absolute;height:30px;overflow:hidden;font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.01em}
.subw span{position:absolute;left:0;top:0;white-space:nowrap}
.subw.c span{left:0;right:0;text-align:center}
.beat{position:absolute;pointer-events:none;z-index:4}
.bigw{position:absolute;height:112px;overflow:hidden}
.bigw span{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;letter-spacing:-.045em;font-size:112px;line-height:112px}
.bigw .rs{font-size:68px;letter-spacing:-.04em}
.beat i{font-size:var(--bs,56px);display:inline-block;font-style:normal;font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap;opacity:0;transform-origin:left center}
.beat.sm i{font-size:calc(var(--bs,56px)*.5)}
.beat.c i{transform-origin:center}
.cdot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--coral)}
.note20{position:absolute;left:0;right:0;top:712px;text-align:center;font-size:15px;line-height:20px;opacity:0;transition:opacity 500ms ease-in-out 900ms}
.note20.show{opacity:1}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade 180ms ease-in-out both;z-index:10}
.sheet{position:absolute;left:8px;right:8px;bottom:42px;z-index:11;display:flex;flex-direction:column;gap:8px;animation:sheetin 550ms var(--settle) both}
.sheet .g{background:#fff;border-radius:13px;overflow:hidden;text-align:center}
.sheet .t{padding:14px 16px 12px}
.sheet .t b{display:block;font-size:13px;font-weight:600;color:var(--ink2)}
.sheet .t span{display:block;font-size:13px;color:var(--ink3);margin-top:2px}
.sheet button{display:block;width:100%;height:57px;border:0;border-top:1px solid var(--border);background:#fff;font-size:20px;color:var(--ink)}
.sheet button.del{color:var(--coral)}
.sheet button.bd{font-weight:600}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetin{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);height:40px;border-radius:20px;padding:0 18px;display:flex;align-items:center;white-space:nowrap;font-weight:600;font-size:14px;z-index:12;animation:fade 180ms ease-in-out both;transition:opacity 180ms ease-in-out}
.toast.dk{background:var(--ink);color:#fff}
.hap{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink2);margin-top:8px}
#hdot{width:10px;height:10px;border-radius:50%;background:var(--ink);opacity:.25}
#hdot.pop{animation:hpop 420ms var(--settle)}
@keyframes hpop{0%{transform:scale(.4);opacity:1}60%{transform:scale(1.5);opacity:1}100%{transform:scale(1);opacity:.5}}
.note{font-size:12px;color:var(--ink2);line-height:16px}
.card{position:absolute;background:#fff;border-radius:24px;box-shadow:0 0 0 1px var(--border),0 6px 18px rgba(0,0,0,.05);overflow:hidden}
@media (prefers-reduced-motion:reduce){
#ui.ent .e{animation-name:fadeonly}
.btn,.grp{transform:none!important}
.sheet{animation:fadeonly 180ms ease-in-out both}
#hdot.pop{animation:fadeonly 300ms ease-in-out}
}
@keyframes fadeonly{from{opacity:0}to{opacity:1}}
</style></head><body>
<div class="col">
<div class="seg" id="seg">
<button data-v="ra">ridge a · ascent</button><button data-v="rb">ridge b · first light</button><button data-v="ma">matrix a · swarm</button><button data-v="mb">matrix b · the stack</button>
</div>
<div class="ctl">
<label>screen <select id="c-screen"><option value="setup">setup</option><option value="timer">timer</option></select></label>
<label>apple health <select id="c-health"><option value="1">has workouts</option><option value="0">none</option></select></label>
<label>home left <select id="c-left"><option value="2">2</option><option value="1">1</option></select></label>
<label>week <select id="c-week"><option value="def">today makes 3 of 4</option><option value="alt">today keeps the week</option></select></label>
<label>streak <select id="c-streak"><option value="6">6 weeks</option><option value="0">0</option></select></label>
</div>
<div class="ctl" id="tbs">
<button class="tb on" data-sp="1">1×</button><button class="tb" data-sp="60">60×</button>
<button class="tb" data-j="290">→ 4:50</button><button class="tb" data-j="590">→ 9:50</button><button class="tb" data-j="880">→ 14:40</button><button class="tb" data-j="1190">→ 19:50</button><button class="tb" data-j="1200">→ 20:00</button><button class="tb" data-j="1620">→ 27:00</button>
<button class="tb" data-restart="1">restart</button>
</div>
<div id="fit"><div id="phone"><div id="base"></div><div id="ui"></div><div id="over"></div><div class="hom"></div></div></div>
<div class="hap"><i id="hdot"></i><span id="htext">no haptic yet</span></div>
<div class="note" id="note"></div>
</div>

/* ----- rolling label ----- */
function roll(el,txt){
 if(el._t===txt)return;const first=el._t==null;el._t=txt;
 const n=document.createElement('span');n.textContent=txt;const olds=[...el.children];el.appendChild(n);
 if(first){return}
 if(RM){n.animate([{opacity:0},{opacity:1}],{duration:300,fill:'both'});olds.forEach(o=>o.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}).onfinish=()=>o.remove());return}
 n.animate([{transform:'translateY(100%)',opacity:0},{transform:'none',opacity:1}],{duration:500,easing:SETTLE,fill:'both'});
 olds.forEach(o=>o.animate([{transform:'none',opacity:1},{transform:'translateY(-100%)',opacity:0}],{duration:500,easing:SETTLE,fill:'forwards'}).onfinish=()=>o.remove())}

function playBeat(text,kind){

 i.getAnimations().forEach(a=>a.cancel());
 i.textContent=text;b.classList.toggle('sm',kind==='soft');
 const maxW=+(b.dataset.w||334);i.style.fontSize='';
 const base=parseFloat(getComputedStyle(i).fontSize);
 if(i.offsetWidth>maxW)i.style.fontSize=(base*maxW/i.offsetWidth)+'px';
 const dur=kind==='soft'?1200:(kind==='commit'?1600:1500);
 const hold=kind==='soft'?.75:.8;
 let kf;
 if(RM)kf=[{opacity:0},{opacity:1,offset:.25},{opacity:1,offset:hold},{opacity:0}];
 else kf=[{opacity:0,transform:'scale(1.3)',easing:SETTLE},{opacity:1,transform:'scale(1)',offset:550/dur},{opacity:1,transform:'scale(1)',offset:hold},{opacity:0,transform:'scale(1)'}];

const MBW=334,MBH=392,RP=10.2,CP_=8,BASE=352,HOVER=22,MBG=BASE-20*RP;

function mbFrame(c){

 {let a=.32,lw=1.2;g.setLineDash([5,4]);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymLock · plans changed · 4 pauses</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#E9E7E2;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 28px}
  .ctl{width:min(390px,100%);display:flex;flex-direction:column;gap:6px}
  .seg{display:flex;background:#DAD7D0;border-radius:12px;padding:3px;gap:2px}
  .seg button{flex:1;border:0;background:transparent;font:600 12px -apple-system,system-ui;padding:8px 2px;border-radius:9px;color:#444}
  .seg button.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  .row select,.row button{font:500 12px -apple-system,system-ui;border:0;background:#fff;border-radius:9px;padding:6px 7px;color:#222}
  .row button{background:#222;color:#fff}
  .phone{width:min(390px,100%);aspect-ratio:390/844;border-radius:46px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2);background:#000;position:relative}
  .phone iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform-origin:0 0}
  .hap{height:26px;display:flex;align-items:center;gap:8px;font:600 12px ui-monospace,Menlo,monospace;color:#555}
  .hap i{width:10px;height:10px;border-radius:50%;background:#bbb;transition:transform .12s,background .12s}
  .hap i.go{transform:scale(1.8);background:#111}
  .note{width:min(390px,100%);font:500 11px -apple-system,system-ui;color:#777;line-height:1.4}
</style>
</head>
<body>
<div class="ctl">
  <div class="seg" id="seg">
    <button data-v="mprinter" class="on">matrix printer</button>
    <button data-v="ridge">ridge</button>
    <button data-v="day0">day 0</button>
  </div>
  <div class="row">
    <select id="ctx"><option value="wake">just woke up</option><option value="trip">on the way</option><option value="closed">window closed</option></select>
    <select id="visits"><option value="4">visit 4</option><option value="23" selected>visit 23</option><option value="52">visit 52</option><option value="80">visit 80</option></select>
    <select id="reason"><option value="laterToday">"go later"</option><option value="scrolling">"scrolling"</option><option value="exhausted">"exhausted"</option><option value="scheduleChanges">"schedule"</option><option value="none">no reason</option></select>
    <select id="lastMissed"><option value="0">last: went</option><option value="1">last: skipped</option></select>
    <select id="week"><option value="ok">week ok</option><option value="risk">week at risk</option></select>
    <select id="homeLeft"><option value="2">2 home left</option><option value="0">0 home left</option></select>
    <select id="day0"><option value="video">day 0 video</option><option value="photo">day 0 photo</option><option value="none">no day 0</option></select>
    <button id="skip">skip wait</button><button id="restart">restart</button>
  </div>
</div>
<div class="phone" id="phone"><iframe id="f" title="prototype"></iframe></div>
<div class="hap"><i id="hd"></i><span id="hl">haptics show here</span></div>
<p class="note">Demo data. The controls, this dot and the frame are not part of the app. The day 0 media is a stand-in for the user's real video or photo. Haptics can't play in a browser, so the dot shows each one.</p>
<script>
const SRC = {"mprinter": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>GymLock \u00b7 matrix printer<\/title>\n<style>\n  :root{--bg:#FAF9F6;--ink:#1A1A1A;--grey:#6B6B6B;--faint:#999}\n  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\n  html,body{width:100vw;height:100vh;background:var(--bg);color:var(--ink);overflow:hidden;\n    font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Helvetica Neue\",Arial,sans-serif;-webkit-font-smoothing:antialiased;\n    -webkit-user-select:none;user-select:none;touch-action:manipulation}\n  #app{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden}\n  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n\n  /* chrome */\n  #hd{position:absolute;top:58px;left:0;right:0;height:36px;display:flex;align-items:center;justify-content:center;gap:7px;\n    font-size:17px;font-weight:700;letter-spacing:-.2px;pointer-events:none;transition:opacity .3s}\n  #hd svg{width:13px;height:15px}\n  #x{position:absolute;top:58px;right:16px;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;z-index:9;\n    background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);\n    border:1px solid rgba(255,255,255,.8);box-shadow:0 2px 10px rgba(0,0,0,.08);transition:opacity .3s,transform .12s}\n  #x::before{content:\"\";position:absolute;inset:-4px}\n  #x:active{transform:scale(.92)}\n  #x svg{width:12px;height:12px}\n  #pips{position:absolute;top:104px;left:0;right:0;height:6px;display:flex;justify-content:center;gap:6px;opacity:0;transition:opacity .35s;pointer-events:none}\n  #pips i{display:block;width:6px;height:6px;border-radius:3px;background:rgba(26,26,26,.15);transition:width .3s ease,background .3s ease}\n  #pips i.on{width:18px;background:var(--ink)}\n\n  /* stage */\n  #stage{position:absolute;left:0;width:100%;pointer-events:none;transition:opacity .3s}\n  #stage canvas{position:absolute;left:0;top:0;display:block}\n  #paper,.fly{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30px);mask-image:linear-gradient(to bottom,transparent 0,#000 30px)}\n\n  /* bottom: timer / primary button */\n  #go{position:absolute;left:28px;right:28px;height:56px;border-radius:28px;background:#F0EEE9;overflow:hidden;\n    font-size:17px;font-weight:600;color:#6B6B6B;font-variant-numeric:tabular-nums;transition:opacity .3s,transform .12s}\n  #go .fill{position:absolute;inset:0;background:#E4E1DA;transform-origin:0 50%;transform:scaleX(0)}\n  #go .lab{position:absolute;inset:0;display:grid;place-items:center;letter-spacing:-.1px}\n  #go .rdy{position:absolute;inset:0;background:#1A1A1A;color:#fff;opacity:0;transition:opacity .15s linear;display:grid;place-items:center}\n  #go .rdy span{display:block;transition:opacity .12s linear}\n  #go.ready .rdy{opacity:1}\n  #go.ready:active{transform:scale(.98)}\n  #go.done{opacity:.35;pointer-events:none}\n  #fine,#sec{position:absolute;left:28px;right:28px;height:44px;text-align:center;transition:opacity .3s}\n  #fine{display:grid;place-items:center;font-size:12px;color:var(--faint);pointer-events:none}\n  #sec{font-size:16px;font-weight:600;color:var(--grey);opacity:0;pointer-events:none}\n  #sec.on{opacity:1;pointer-events:auto}\n  #closed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;letter-spacing:-.3px;opacity:0;pointer-events:none;transition:opacity .4s .15s}\n  #app.closed #closed{opacity:1}\n  #app.closed #stage,#app.closed #pips,#app.closed #go,#app.closed #fine,#app.closed #sec,#app.closed #x{opacity:0;pointer-events:none;transition:opacity .3s}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n  <div id=\"hd\">\n    <svg viewBox=\"0 0 13 15\" fill=\"none\"><path d=\"M3.4 6.4V4.6a3.1 3.1 0 0 1 6.2 0v1.8\" stroke=\"#E85D4E\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><rect x=\"1\" y=\"6.2\" width=\"11\" height=\"8\" rx=\"2.2\" fill=\"#E85D4E\"/><\/svg>\n    <span>GymLock<\/span>\n  <\/div>\n  <button id=\"x\" aria-label=\"close\"><svg viewBox=\"0 0 12 12\"><path d=\"M1.5 1.5l9 9M10.5 1.5l-9 9\" stroke=\"#1A1A1A\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><\/svg><\/button>\n  <div id=\"pips\"><\/div>\n  <div id=\"stage\"><canvas id=\"paper\"><\/canvas><canvas id=\"mach\"><\/canvas><\/div>\n  <button id=\"go\"><i class=\"fill\"><\/i><span class=\"lab\" id=\"wl\">0:30<\/span><span class=\"rdy\"><span id=\"rl\">continue<\/span><\/span><\/button>\n  <div id=\"fine\">close to keep going. no wait.<\/div>\n  <button id=\"sec\"><\/button>\n  <div id=\"closed\">closed. still going.<\/div>\n<\/div>\n<script>/* GymLock \u00b7 \"plans changed\" pause \u00b7 shared engine for all 4 variants.\n   Owns: demo scenario, the copy (lines + choices), reading pace, the 30 s clock, demo haptic log.\n   Variants own only the look and motion. Do not edit this file from a variant. */\n(function () {\n  const WAIT = 30;\n\n  /* ---------------- scenario (stands in for real app data) ---------------- */\n  const DEFAULT = {\n    ctx: 'wake',          // 'wake' just woke (window open) | 'trip' on the way | 'closed' window ran out\n    visits: 23,           // gym visits so far (GymVisitTracker); day N of 66 counts these\n    lastMissed: false,    // last planned session was skipped\n    weekDone: 1, weekGoal: 3, plannedLeft: 3, // plannedLeft includes today (SkipRules.chancesRemaining)\n    reason: 'laterToday', // OnboardingProfile.failureReasons first pick, or 'none'\n    gymBy: '7:05', now: '6:41', etaMin: 12, graceMin: 10,\n    homeLeft: 2, homeMin: 25,\n    day0: 'video',        // Day0Media kind: 'video' | 'photo' | 'none'\n    day0Date: 'sep 12',\n    streakWeeks: 6,       // week streak (StreakChip number)\n    alarmAt: '6:30', date: 'tue nov 24'\n  };\n  let cfg = Object.assign({}, DEFAULT);\n\n  /* ---------------- reading pace ----------------\n     Adults read about 238 words a minute silently (Brysbaert, 2019). Just after waking, sleep inertia\n     slows thinking (Hilditch, 2019), so we pace for 150 wpm = 2.5 words a second, plus time to notice\n     the line and a dwell before the next one. */\n  const WPS = 2.5, NOTICE = 0.5, DWELL = 1.1, MIN_LINE = 2.4, START = 0.7;\n  const words = s => s.trim().split(/\\s+/).length;\n  const lineDuration = s => Math.max(MIN_LINE, NOTICE + words(s) / WPS + DWELL);\n\n  /* ---------------- the copy ---------------- */\n  const OWN = {\n    laterToday: '\"i tell myself i\\'ll go later.\"',\n    scrolling: '\"i start scrolling.\"',\n    exhausted: '\"i\\'m exhausted.\"',\n    scheduleChanges: '\"my schedule changes.\"'\n  };\n  const OWN_AFTER = {\n    laterToday: 'this is that sentence, happening.',\n    scrolling: 'skip, and the apps open. that is the trade.',\n    exhausted: '10 easy minutes lifts energy. today can be a light one.',\n    scheduleChanges: (c) => `if it really did, ${c.homeMin} minutes at home still counts.`\n  };\n  function stage(c) {\n    if (c.visits < 10) return 'new';\n    if (c.visits < 40) return 'building';\n    if (c.visits < 66) return 'close';\n    return 'habit';\n  }\n  function weekReachableWithoutToday(c) { return c.weekDone + (c.plannedLeft - 1) >= c.weekGoal; }\n\n  /* Returns the lines for the 30 s, in order, each with its start time and duration.\n     kind: 'ground' | 'own' | 'quote' | 'stake' | 'fact' | 'close'. A fact carries src. */\n  function lines(c = cfg) {\n    const L = [];\n    const add = (p, kind, text, extra) => L.push(Object.assign({ p, kind, text }, extra || {}));\n\n    // 1. where you are right now\n    if (c.ctx === 'wake') add(1, 'ground', 'you beat the alarm. the rest is shoes and a door.');\n    if (c.ctx === 'trip') add(1, 'ground', `you're ${c.etaMin} minutes from the gym.`);\n    if (c.ctx === 'closed') add(1, 'ground', `gym time was ${c.gymBy}. it is ${c.now} now.`);\n\n    // 2. their own words from day 0\n    if (OWN[c.reason]) {\n      add(2, 'own', 'on day 0 you told us why you miss:');\n      add(2, 'quote', OWN[c.reason]);\n      const after = OWN_AFTER[c.reason];\n      add(2, 'own', typeof after === 'function' ? after(c) : after);\n    }\n\n    // 3. the stakes, from real numbers\n    if (c.lastMissed) add(3, 'stake', 'last time was a skip too. two in a row is where habits slip.');\n    else if (!weekReachableWithoutToday(c)) add(3, 'stake', `skip today and ${c.weekGoal} this week is out of reach.`);\n    else add(6, 'stake', `today would make it ${c.weekDone + 1} of ${c.weekGoal} this week.`);\n\n    // 4. one concrete fact for where they are in the habit\n    const s = stage(c);\n    if (s === 'new') add(4, 'fact', 'people expect a workout to feel worse than it does. they only picture the first minutes.', { src: 'ruby et al., 2011' });\n    if (s === 'building') add(4, 'fact', `every visit makes the next one take less effort. you have ${c.visits} behind you.`, { src: 'lally et al., 2010' });\n    if (s === 'close') add(4, 'fact', `${66 - c.visits} more visits and going stops being a decision.`, { src: 'lally et al., 2010' });\n    if (s === 'habit') add(4, 'fact', `${c.visits} visits. one more keeps it automatic.`, { src: 'lally et al., 2010' });\n\n    // 5. the way forward\n    if (c.ctx === 'closed') add(5, 'close', `go now and you get ${c.graceMin} more minutes.`);\n    else add(5, 'close', `gym by ${c.gymBy}. you can still make it.`);\n\n    // fit into 30 s by reading pace: drop the lowest priority until it fits\n    let fitted = L.slice();\n    const total = arr => START + arr.reduce((a, l) => a + lineDuration(l.text), 0);\n    while (total(fitted) > WAIT - 0.4 && fitted.length > 1) {\n      const worst = fitted.reduce((w, l) => (l.p > w.p ? l : w), fitted[0]);\n      // own words travel as a block of three: drop the whole block or none\n      fitted = worst.p === 2 ? fitted.filter(l => l.p !== 2) : fitted.filter(l => l !== worst);\n    }\n    let t = START;\n    return fitted.map(l => { const d = lineDuration(l.text); const o = Object.assign({}, l, { t, d, words: words(l.text) }); t += d; return o; });\n  }\n\n  /* ---------------- the three choices, in order ---------------- */\n  function choices(c = cfg) {\n    const list = [];\n    list.push({\n      key: 'gym', title: 'still going', icon: 'shoe',\n      lead: c.ctx === 'closed' ? `${c.graceMin} more minutes. not a new window.` : `gym by ${c.gymBy}.`,\n      perks: [`visit ${c.visits + 1} of 66`, `this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'apps unlock when you arrive'],\n      primary: \"i'm going\", secondary: 'not this'\n    });\n    if (c.homeLeft > 0) list.push({\n      key: 'home', title: 'quick workout instead', icon: 'house',\n      lead: `${c.homeMin} minutes at home counts as a full day.`,\n      perks: [`this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'checked by apple health or a photo', `${c.homeLeft} of 3 left this month`],\n      primary: `start ${c.homeMin} minutes`, secondary: 'not this either'\n    });\n    const reachable = weekReachableWithoutToday(c);\n    list.push({\n      key: 'cant', title: \"can't today\", icon: 'calendar',\n      lead: reachable ? `no problem. you need ${c.weekGoal - c.weekDone} more this week.` : 'make it up. this keeps your streak.',\n      perks: [`one skip won't undo ${c.visits} visits`, 'next, pick a day to make it up'],\n      primary: \"can't today\", secondary: 'back to the gym'\n    });\n    return list;\n  }\n\n  /* ---------------- receipt rows (for the printer variant; any variant may use) ---------------- */\n  function receipt(c = cfg) {\n    const rows = [\n      ['gym by', c.gymBy],\n      ['this visit', `${c.visits + 1} of 66`],\n      ['this week', `${c.weekDone} of ${c.weekGoal}`],\n    ];\n    if (c.lastMissed) rows.push(['last time', 'skipped']);\n    if (c.homeLeft >= 0) rows.push(['home workouts', `${c.homeLeft} of 3 left`]);\n    return {\n      rows,\n      said: OWN[c.reason] || null,\n      ifGo: `${c.weekDone + 1} of ${c.weekGoal}`,\n      ifSkip: `${c.weekGoal - c.weekDone} still to do`\n    };\n  }\n\n  /* ---------------- this week as 7 days (Mon first) ----------------\n     state: 'done' | 'today' | 'planned' | 'rest'. Today is Tuesday in the demo. */\n  function week(c = cfg) {\n    const names = ['m', 't', 'w', 't', 'f', 's', 's'];\n    const st = ['done', 'today', 'rest', 'rest', 'rest', 'rest', 'rest'];\n    const later = [3, 5, 4, 6];               // thu, sat, then fri, sun if more are planned\n    for (let i = 0; i < Math.max(0, c.plannedLeft - 1); i++) st[later[i]] = 'planned';\n    return names.map((n, i) => ({ n, state: st[i] }));\n  }\n\n  /* ---------------- the wait button label ---------------- */\n  function timerLabel(elapsed) {\n    const left = Math.max(0, Math.ceil(WAIT - elapsed));\n    return left > 0 ? `0:${String(left).padStart(2, '0')}` : 'continue';\n  }\n\n  /* ---------------- the 30 s clock ---------------- */\n  let t0 = performance.now(), offset = 0;\n  const restartCbs = [];\n  function clock() { return Math.min(WAIT + 600, (performance.now() - t0) / 1000 + offset); }\n  function restart() { t0 = performance.now(); offset = 0; restartCbs.forEach(f => f(cfg)); }\n  function skip() { offset = Math.max(offset, WAIT - (performance.now() - t0) / 1000); }\n  function onRestart(f) { restartCbs.push(f); }\n\n  /* ---------------- demo haptic log (real app: UIImpactFeedbackGenerator) ----------------\n     kinds: 'light' (printer tick), 'soft' (a line lands), 'rigid' (choice changes),\n            'medium' (the 30 s is up), 'heavy' (commit: i'm going / start). */\n  let lastHap = 0;\n  function hap(kind) {\n    const now = performance.now();\n    if (kind === 'light' && now - lastHap < 70) return; // rate limit, as WakeHaptics does\n    lastHap = now;\n    try { parent.postMessage({ gl: 'hap', kind }, '*'); } catch (e) {}\n  }\n  function done  = 1; sec.classList.remove('on'); pips.style.opacity = 0; pips.innerHTML = '';\n}\nGL.onRestart(build);\n\n/* ================= interactions ================= */\nfunction flyAway(perfLocalY, up) {\n  const el = document.createElement('canvas'); el.className = 'fly';\n  el.width = paperCv.width; el.height = paperCv.height;\n  el.style.cssText = 'width:' + W + 'px;height:' + paperWin + 'px;left:0;top:0;transform-origin:50% ' + (perfLocalY == null ? paperWin : perfLocalY) + 'px';\n  const x = el.getContext('2d'); x.drawImage(paperCv, 0, 0);\n  if (perfLocalY != null) x.clearRect(0, Math.ceil(perfLocalY * dpr), el.width, el.height);\n  stage.insertBefore(el, machCv); flyEls.push(el);\n  void el.offsetWidth;\n  if (reduce) { el.style.transition = 'opacity .2s linear'; el.style.opacity = 0; }\n  else {\n    el.style.transition = 'transform 380ms cubic-bezier(.45,0,1,1), opacity 380ms linear';\n    el.style.transform = 'translateY(' + (up ? -40 : -20) + 'px) rotate(2deg)'; el.style.opacity = 0;\n  }\n  setTimeout(() => { el.remove(); flyEls = flyEls.filter(e => e !== el); }, 480);\n}\nfunction startTicket(i, firstFromReceipt, delay) {\n  const list = GL.choices(), c = list[i]; ticketIdx = i;\n  const stub = firstFromReceipt ? tailH : 16;\n  let t = buildTicket(c, 1, stub);\n  const sc = clamp(.64 * paperWin / (t.total + stub), 1, 1.2);\n  if (sc > 1.02) t = buildTicket(c, sc, stub * sc);\n  t.t0 = performance.now() / 1000 + (delay || 0);\n  job = t; presses = []; finished = false;\n  KEYS.forEach(k => k.t = -9);\n  const lab = $('rl'); lab.style.opacity = 0;\n  setTimeout(() => { lab.textContent = c.primary; lab.style.opacity = 1; }, 110);\n  sec.textContent = c.secondary;\n  pips.innerHTML = ''; list.forEach((_, k) => { const d = document.createElement('i'); if (k === i) d.className = 'on'; pips.appendChild(d); });\n  pips.style.opacity = 1; sec.classList.add('on');\n  go.classList.remove('done');\n}\n$('x').addEventListener('click', () => {\n  if (state === 'closed') return;\n  state = 'closed'; GL.done('close'); app.classList.add('closed');\n});\ngo.addEventListener('click', () => {\n  if (state === 'receipt') {\n    if (!contShown) { if (!reduce) go.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-1px)' }, { transform: 'translateX(1px)' }, { transform: 'none' }], { duration: 160 }); return; }\n    state = 'tearing'; GL.hap('medium');\n    fine.style.opacity = 0;\n    const r = job.rows[job.perfIdx], perfY = paperWin - job.feed + r.py + r.h;\n    flyAway(perfY, false);\n    state = 'tickets'; startTicket(0, true, reduce ? .2 : .42);\n    return;\n  }\n  if (state === 'tickets' && !finished) {\n    finished = true; GL.hap('heavy'); GL.done(job.choice.key);\n    const st = job.stamp, t = performance.now() / 1000 - job.t0;\n    st.s = Math.max(t + .05, job.end + .12); st.dur = st.gdur; st.e = st.s + st.dur; st.cs = st.s - .08;\n    go.classList.add('done'); sec.classList.remove('on');\n  }\n});\nsec.addEventListener('click', () => {\n  if (state !== 'tickets' || finished) return;\n  const now = performance.now(); if (now < busyUntil) return; busyUntil = now + 450;\n  GL.hap('rigid'); flyAway(null, true);\n  startTicket((ticketIdx + 1) % GL.choices().length, false);\n});\n\n/* ================= main loop ================= */\nlet lastLab = '';\nfunction frame() {\n  const now = performance.now() / 1000;\n  if (state !== 'closed' && job) {\n    let t;\n    if (state === 'receipt') {\n      t = GL.clock();\n      const lab = GL.timerLabel(t);\n      if (lab !== lastLab) { lastLab = lab; if (t < GL.WAIT) $('wl').textContent = lab; }\n      go.querySelector('.fill').style.transform = 'scaleX(' + clamp(t / GL.WAIT, 0, 1).toFixed(4) + ')';\n      if (t >= GL.WAIT && !contShown) { contShown = true; GL.hap('medium'); go.classList.add('ready'); fine.style.opacity = 0; }\n    } else if (state === 'tickets') t = now - job.t0;\n    else t = job.kind === 'receipt' ? GL.clock() : now - job.t0;\n    if (state !== 'tearing') {\n      const feed = renderPaper(job, t, now);\n      renderMachine(job, t, now, feed);\n    } else renderMachine(job, t, now, job.feed || 0);\n  }\n  requestAnimationFrame(frame);\n}\nlet rw = innerWidth;\naddEventListener('resize', () => { if (innerWidth !== rw && state === 'receipt') { rw = innerWidth; build(); } });\nbuild();\nrequestAnimationFrame(frame);\n})();\n<\/script>\n<\/body>\n<\/html>\n", "ridge": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>GymLock \u00b7 plans changed \u00b7 ridge, first light<\/title>\n<style>\n  :root { --ink:#1A1A1A; --bg:#0B0B0C; }\n  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }\n  html, body { width:100vw; height:100vh; height:100dvh; background:var(--bg); overflow:hidden; }\n  body { font-family:-apple-system,\"SF Pro Text\",\"SF Pro\",system-ui,sans-serif; color:#fff; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }\n  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }\n  #app { position:fixed; inset:0; overflow:hidden; background:var(--bg); }\n\n  /* world: the baked image, camera = transform only */\n  #layer { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }\n  #layer img { position:absolute; inset:0; width:100%; height:100%; display:block; }\n  #warm { position:absolute; inset:0; opacity:0;\n    background:linear-gradient(to bottom, rgba(150,140,130,0) 36%, #968C82 52%, rgba(150,140,130,0) 58%); }\n  #sunclip { position:absolute; inset:0;\n    clip-path:polygon(0% 0%,100% 0%,100% 59.6%,62.2% 59.6%,60.6% 58%,57.8% 55.7%,55.6% 54.9%,54.2% 55.7%,52.8% 56%,50.6% 57%,48.9% 59.6%,0% 59.6%); }\n  #sun { position:absolute; border-radius:50%; background:#E85D4E; transition:opacity 400ms ease-in-out; }\n  #fx { position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; }\n  #fx g.fg { transition:opacity 300ms ease-in-out; opacity:0; }\n  #mist { position:absolute; left:0; width:100%; opacity:0; background:linear-gradient(to bottom, rgba(150,150,158,0), #969699 35%, #969699 65%, rgba(150,150,158,0)); pointer-events:none; }\n  .scrimb { position:absolute; left:0; right:0; bottom:0; height:36%; pointer-events:none; opacity:0; transition:opacity 500ms ease-in-out; background:linear-gradient(to bottom, rgba(11,11,12,0), rgba(11,11,12,.7)); }\n\n  .scrim { position:absolute; left:0; right:0; top:0; height:58%; pointer-events:none;\n    background:linear-gradient(to bottom, rgba(11,11,12,.35), rgba(11,11,12,0)); }\n  #dim { position:absolute; inset:0; background:var(--bg); opacity:0; pointer-events:none; transition:opacity 700ms ease-in-out; }\n  #entry { position:absolute; inset:0; background:var(--bg); pointer-events:none; }\n\n  /* close */\n  #close { position:absolute; top:54px; right:12px; width:44px; height:44px; display:grid; place-items:center; z-index:20; }\n  #close i { width:36px; height:36px; border-radius:50%; display:grid; place-items:center;\n    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25);\n    -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4); }\n  #close svg { width:12px; height:12px; stroke:#fff; stroke-width:1.8; stroke-linecap:round; fill:none; }\n\n  /* pause text */\n  #lines { position:absolute; left:0; right:0; top:max(112px,16.5vh); z-index:5; pointer-events:none; }\n  .ln { position:absolute; left:32px; right:32px; top:0; text-align:center; opacity:0; }\n  .ln .tx { font-size:24px; line-height:30px; font-weight:600; letter-spacing:-.2px; }\n  .ln.quote .tx { font-family:\"New York\",ui-serif,Georgia,serif; font-style:italic; font-weight:400; font-size:26px; line-height:32px; }\n  .ln .w { display:inline-block; opacity:0; white-space:pre; }\n  .ln .src { margin-top:10px; font-size:12px; line-height:16px; color:rgba(255,255,255,.55); }\n\n  #fine { position:absolute; left:0; right:0; bottom:44px; pointer-events:none; text-align:center; font-size:12px; color:rgba(255,255,255,.55); z-index:6; }\n\n  .cap { position:absolute; left:28px; right:28px; height:56px; border-radius:28px; background:#fff; color:var(--ink);\n    font-size:17px; font-weight:600; z-index:10; }\n  #cont { bottom:84px; opacity:0; pointer-events:none; overflow:hidden; background:rgba(255,255,255,.12); color:rgba(255,255,255,.75);\n    font-variant-numeric:tabular-nums; transition:background 150ms, color 150ms; }\n  #cont i { position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(255,255,255,.16); }\n  #cont span { position:relative; }\n  #cont.ready { background:#fff; color:var(--ink); }\n  #cont.ready i { display:none; }\n\n  /* choices */\n  #pips { position:absolute; top:70px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:8; pointer-events:none; }\n  #pips b { width:6px; height:6px; border-radius:3px; background:rgba(255,255,255,.35); transition:width 400ms ease-in-out, background 400ms; }\n  #pips b.on { width:18px; background:#fff; }\n  #ch { position:absolute; left:32px; right:32px; top:0; height:100%; z-index:6; pointer-events:none; }\n  .cs { position:absolute; left:0; right:0; top:90px; opacity:0; transform:translateY(12px); transition:opacity 350ms ease-in-out, transform 700ms ease-in-out; text-align:center; }\n  .cs.on { opacity:1; transform:none; }\n  .cs.out { transform:translateY(-12px); }\n  .cs h2 { font-size:32px; line-height:38px; font-weight:700; letter-spacing:-.4px; }\n  .cs .lead { margin-top:10px; font-size:17px; line-height:23px; color:rgba(255,255,255,.8); }\n  .cs ul { margin-top:16px; list-style:none; text-align:center; }\n  .cs li { font-size:16px; line-height:22px; margin-top:6px; color:rgba(255,255,255,.8); opacity:0; transform:translateY(8px); transition:opacity 300ms ease-in-out, transform 300ms ease-in-out; }\n  .cs.on li { opacity:1; transform:none; transition-delay:calc(var(--i) * 60ms + 200ms); }\n  #acts { position:absolute; left:0; right:0; bottom:0; z-index:10; display:none; }\n  #prim { bottom:84px; }\n  #sec { position:absolute; left:28px; right:28px; bottom:28px; height:44px; font-size:16px; font-weight:600; color:rgba(255,255,255,.7); }\n\n  #end { position:absolute; left:32px; right:32px; top:42%; text-align:center; font-size:17px; color:rgba(255,255,255,.8); z-index:9; opacity:0; transition:opacity 500ms ease-in-out; pointer-events:none; }\n  #end.on { opacity:1; }\n\n  @media (prefers-reduced-motion: reduce) {\n    .cs li, .cs.on li { transform:none !important; }\n    .cs, .cs.out, .cs.on { transform:none !important; transition:opacity 350ms ease-in-out !important; }\n    #pips b { transition:none; }\n  }\n<\/style>\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n<script>/* GymLock \u00b7 \"plans changed\" pause \u00b7 shared engine for all 4 variants.\n   Owns: demo scenario, the copy (lines + choices), reading pace, the 30 s clock, demo haptic log.\n   Variants own only the look and motion. Do not edit this file from a variant. */\n(function () {\n  const WAIT = 30;\n\n  /* ---------------- scenario (stands in for real app data) ---------------- */\n  const DEFAULT = {\n    ctx: 'wake',          // 'wake' just woke (window open) | 'trip' on the way | 'closed' window ran out\n    visits: 23,           // gym visits so far (GymVisitTracker); day N of 66 counts these\n    lastMissed: false,    // last planned session was skipped\n    weekDone: 1, weekGoal: 3, plannedLeft: 3, // plannedLeft includes today (SkipRules.chancesRemaining)\n    reason: 'laterToday', // OnboardingProfile.failureReasons first pick, or 'none'\n    gymBy: '7:05', now: '6:41', etaMin: 12, graceMin: 10,\n    homeLeft: 2, homeMin: 25,\n    day0: 'video',        // Day0Media kind: 'video' | 'photo' | 'none'\n    day0Date: 'sep 12',\n    streakWeeks: 6,       // week streak (StreakChip number)\n    alarmAt: '6:30', date: 'tue nov 24'\n  };\n  let cfg = Object.assign({}, DEFAULT);\n\n  /* ---------------- reading pace ----------------\n     Adults read about 238 words a minute silently (Brysbaert, 2019). Just after waking, sleep inertia\n     slows thinking (Hilditch, 2019), so we pace for 150 wpm = 2.5 words a second, plus time to notice\n     the line and a dwell before the next one. */\n  const WPS = 2.5, NOTICE = 0.5, DWELL = 1.1, MIN_LINE = 2.4, START = 0.7;\n  const words = s => s.trim().split(/\\s+/).length;\n  const lineDuration = s => Math.max(MIN_LINE, NOTICE + words(s) / WPS + DWELL);\n\n  /* ---------------- the copy ---------------- */\n  const OWN = {\n    laterToday: '\"i tell myself i\\'ll go later.\"',\n    scrolling: '\"i start scrolling.\"',\n    exhausted: '\"i\\'m exhausted.\"',\n    scheduleChanges: '\"my schedule changes.\"'\n  };\n  const OWN_AFTER = {\n    laterToday: 'this is that sentence, happening.',\n    scrolling: 'skip, and the apps open. that is the trade.',\n    exhausted: '10 easy minutes lifts energy. today can be a light one.',\n    scheduleChanges: (c) => `if it really did, ${c.homeMin} minutes at home still counts.`\n  };\n  function stage(c) {\n    if (c.visits < 10) return 'new';\n    if (c.visits < 40) return 'building';\n    if (c.visits < 66) return 'close';\n    return 'habit';\n  }\n  function weekReachableWithoutToday(c) { return c.weekDone + (c.plannedLeft - 1) >= c.weekGoal; }\n\n  /* Returns the lines for the 30 s, in order, each with its start time and duration.\n     kind: 'ground' | 'own' | 'quote' | 'stake' | 'fact' | 'close'. A fact carries src. */\n  function lines(c = cfg) {\n    const L = [];\n    const add = (p, kind, text, extra) => L.push(Object.assign({ p, kind, text }, extra || {}));\n\n    // 1. where you are right now\n    if (c.ctx === 'wake') add(1, 'ground', 'you beat the alarm. the rest is shoes and a door.');\n    if (c.ctx === 'trip') add(1, 'ground', `you're ${c.etaMin} minutes from the gym.`);\n    if (c.ctx === 'closed') add(1, 'ground', `gym time was ${c.gymBy}. it is ${c.now} now.`);\n\n    // 2. their own words from day 0\n    if (OWN[c.reason]) {\n      add(2, 'own', 'on day 0 you told us why you miss:');\n      add(2, 'quote', OWN[c.reason]);\n      const after = OWN_AFTER[c.reason];\n      add(2, 'own', typeof after === 'function' ? after(c) : after);\n    }\n\n    // 3. the stakes, from real numbers\n    if (c.lastMissed) add(3, 'stake', 'last time was a skip too. two in a row is where habits slip.');\n    else if (!weekReachableWithoutToday(c)) add(3, 'stake', `skip today and ${c.weekGoal} this week is out of reach.`);\n    else add(6, 'stake', `today would make it ${c.weekDone + 1} of ${c.weekGoal} this week.`);\n\n    // 4. one concrete fact for where they are in the habit\n    const s = stage(c);\n    if (s === 'new') add(4, 'fact', 'people expect a workout to feel worse than it does. they only picture the first minutes.', { src: 'ruby et al., 2011' });\n    if (s === 'building') add(4, 'fact', `every visit makes the next one take less effort. you have ${c.visits} behind you.`, { src: 'lally et al., 2010' });\n    if (s === 'close') add(4, 'fact', `${66 - c.visits} more visits and going stops being a decision.`, { src: 'lally et al., 2010' });\n    if (s === 'habit') add(4, 'fact', `${c.visits} visits. one more keeps it automatic.`, { src: 'lally et al., 2010' });\n\n    // 5. the way forward\n    if (c.ctx === 'closed') add(5, 'close', `go now and you get ${c.graceMin} more minutes.`);\n    else add(5, 'close', `gym by ${c.gymBy}. you can still make it.`);\n\n    // fit into 30 s by reading pace: drop the lowest priority until it fits\n    let fitted = L.slice();\n    const total = arr => START + arr.reduce((a, l) => a + lineDuration(l.text), 0);\n    while (total(fitted) > WAIT - 0.4 && fitted.length > 1) {\n      const worst = fitted.reduce((w, l) => (l.p > w.p ? l : w), fitted[0]);\n      // own words travel as a block of three: drop the whole block or none\n      fitted = worst.p === 2 ? fitted.filter(l => l.p !== 2) : fitted.filter(l => l !== worst);\n    }\n    let t = START;\n    return fitted.map(l => { const d = lineDuration(l.text); const o = Object.assign({}, l, { t, d, words: words(l.text) }); t += d; return o; });\n  }\n\n  /* ---------------- the three choices, in order ---------------- */\n  function choices(c = cfg) {\n    const list = [];\n    list.push({\n      key: 'gym', title: 'still going', icon: 'shoe',\n      lead: c.ctx === 'closed' ? `${c.graceMin} more minutes. not a new window.` : `gym by ${c.gymBy}.`,\n      perks: [`visit ${c.visits + 1} of 66`, `this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'apps unlock when you arrive'],\n      primary: \"i'm going\", secondary: 'not this'\n    });\n    if (c.homeLeft > 0) list.push({\n      key: 'home', title: 'quick workout instead', icon: 'house',\n      lead: `${c.homeMin} minutes at home counts as a full day.`,\n      perks: [`this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'checked by apple health or a photo', `${c.homeLeft} of 3 left this month`],\n      primary: `start ${c.homeMin} minutes`, secondary: 'not this either'\n    });\n    const reachable = weekReachableWithoutToday(c);\n    list.push({\n      key: 'cant', title: \"can't today\", icon: 'calendar',\n      lead: reachable ? `no problem. you need ${c.weekGoal - c.weekDone} more this week.` : 'make it up. this keeps your streak.',\n      perks: [`one skip won't undo ${c.visits} visits`, 'next, pick a day to make it up'],\n      primary: \"can't today\", secondary: 'back to the gym'\n    });\n    return list;\n  }\n\n  /* ---------------- receipt rows (for the printer variant; any variant may use) ---------------- */\n  function receipt(c = cfg) {\n    const rows = [\n      ['gym by', c.gymBy],\n      ['this visit', `${c.visits + 1} of 66`],\n      ['this week', `${c.weekDone} of ${c.weekGoal}`],\n    ];\n    if (c.lastMissed) rows.push(['last time', 'skipped']);\n    if (c.homeLeft >= 0) rows.push(['home workouts', `${c.homeLeft} of 3 left`]);\n    return {\n      rows,\n      said: OWN[c.reason] || null,\n      ifGo: `${c.weekDone + 1} of ${c.weekGoal}`,\n      ifSkip: `${c.weekGoal - c.weekDone} still to do`\n    };\n  }\n\n  /* ---------------- this week as 7 days (Mon first) ----------------\n     state: 'done' | 'today' | 'planned' | 'rest'. Today is Tuesday in the demo. */\n  function week(c = cfg) {\n    const names = ['m', 't', 'w', 't', 'f', 's', 's'];\n    const st = ['done', 'today', 'rest', 'rest', 'rest', 'rest', 'rest'];\n    const later = [3, 5, 4, 6];               // thu, sat, then fri, sun if more are planned\n    for (let i = 0; i < Math.max(0, c.plannedLeft - 1); i++) st[later[i]] = 'planned';\n    return names.map((n, i) => ({ n, state: st[i] }));\n  }\n\n  /* ---------------- the wait button label ---------------- */\n  function timerLabel(elapsed) {\n    const left = Math.max(0, Math.ceil(WAIT - elapsed));\n    return left > 0 ? `0:${String(left).padStart(2, '0')}` : 'continue';\n  }\n\n  /* ---------------- the 30 s clock ---------------- */\n  let t0 = performance.now(), offset = 0;\n  const restartCbs = [];\n  function clock() { return Math.min(WAIT + 600, (performance.now() - t0) / 1000 + offset); }\n  function restart() { t0 = performance.now(); offset = 0; restartCbs.forEach(f => f(cfg)); }\n  function skip() { offset = Math.max(offset, WAIT - (performance.now() - t0) / 1000); }\n  function onRestart(f) { restartCbs.push(f); }\n\n  /* ---------------- demo haptic log (real app: UIImpactFeedbackGenerator) ----------------\n     kinds: 'light' (printer tick), 'soft' (a line lands), 'rigid' (choice changes),\n            'medium' (the 30 s is up), 'heavy' (commit: i'm going / start). */\n  let lastHap = 0;\n  function hap(kind) {\n    const now = performance.now();\n    if (kind === 'light' && now - lastHap < 70) return; // rate limit, as WakeHaptics does\n    lastHap = now;\n    try { parent.postMessage({ gl: 'hap', kind }, , ih);\n    fx.style.width = iw + 'px'; fx.style.height = ih + 'px';\n    mist.style.top = 1230 * k + 'px'; mist.style.height = 230 * k + 'px';\n    const FX = {};\n    function makeTrail(key, d, marker) {\n      const sc = CAMS[key].s, u = 1 / (k * sc);            // 1 screen pt in viewBox units at that camera\n      const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'fg'); fx.appendChild(g);\n      const path = document.createElementNS(NS, 'path'); path.setAttribute('d', d);\n      const L = path.getTotalLength(), step = 8 * u, dots = [];\n      for (let q = L; q >= 0; q -= step) {                 // bottom of the path is the end of d? d runs bottom to top, so reverse sampling order\n        const pt = path.getPointAtLength(L - q);\n        const c = document.createElementNS(NS, 'circle');\n        c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('r', 1.6 * u);\n        c.setAttribute('fill', '#fff'); c.setAttribute('fill-opacity', '.95'); c.style.opacity = 0; g.appendChild(c); dots.push(c);\n      }\n      let m = null;\n      if (marker) {\n        const e = path.getPointAtLength(L), z = 8 * u;\n        // a small hut: pitched roof, body, a dark door. Sits on the trail's end.\n        const w = 11 * u, h = 7 * u, r = 5 * u, x0 = e.x - w / 2, yb = e.y + 1 * u;\n        m = document.createElementNS(NS, 'g'); m.style.opacity = 0;\n        const body = document.createElementNS(NS, 'path');\n        body.setAttribute('d', `M${x0} ${yb} L${x0} ${yb - h} L${e.x} ${yb - h - r} L${x0 + w} ${yb - h} L${x0 + w} ${yb} Z`);\n        body.setAttribute('fill', '#fff');\n        const door = document.createElementNS(NS, 'rect');\n        door.setAttribute('x', e.x - 1.6 * u); door.setAttribute('y', yb - 4 * u); door.setAttribute('width', 3.2 * u); door.setAttribute('height', 4 * u);\n        door.setAttribute('fill', '#2a2a2c');\n        m.appendChild(body); m.appendChild(door); g.appendChild(m);\n      }\n      FX[key] = { g, dots, m, t0: 0, prog: 0 };\n    }\n    makeTrail('gym', 'M444 1400 C 444 1370, 448 1350, 452 1320 S 480 1200, 497 1100', false);\n    makeTrail('home', 'M520 1445 C 560 1430, 600 1405, 610 1378 S 618 1352, 620 1338', true);\n    FX.cant = { t0: 0 };\n    function fxStart(key) {\n      Object.keys(FX).forEach(k2 => { if (FX[k2].g) FX[k2].g.style.opacity = k2 === key ? 1 : 0; });\n      FX[key].t0 = performance.now();\n      mist.style.opacity = 0;\n      sun.style.opacity = key === 'gym' ? 1 : 0;\n    }\n    function fxFrame(now) {\n      if (phase !== 'choice') return;\n      const key = C[idx].key, f = FX[key];\n      if (f.dots) {\n        const pr = clamp((now - f.t0 - (RM ? 0 : 700)) / (RM ? 1 : 900));\n        const n = f.dots.length;\n        f.dots.forEach((c, i) => { c.style.opacity = (i / n <= pr) ? 1 : 0; });\n        if (f.m) f.m.style.opacity = clamp((pr - .98) * 50);\n      } else {\n        const q = RM ? 1 : clamp((now - f.t0 - 300) / 1200), e = ease(q);\n        mist.style.opacity = (.5 * e).toFixed(3);\n        mist.style.transform = `translateX(${(-180 * (1 - e) * k).toFixed(1)}px)`;\n      }\n    }\n    function layoutChoice(i) {                                     // centre the block in the sky between pips and tip\n      const c = CAMS[C[i].key], tipY = oy + c.ty + c.s * APEX.y * k;\n      const top = 88, bottom = tipY - (C[i].key === 'gym' ? 62 : 28);\n      const el = chEls[i], h = el.offsetHeight;\n      el.style.top = Math.max(92, top + (bottom - top - h) / 2) + 'px';\n    }\n    chEls.forEach((_, i) => layoutChoice(i));\n\n    /* state */\n    let phase = 'pause', idx = 0, lineHap = -1, medium = false, ended = false;\n    const hap = k2 => GL.hap(k2);\n\n    function showChoice(i, first) {\n      chEls.forEach((el, j) => {\n        if (j === i) { el.classList.remove('out'); el.classList.add('on'); }\n        else { if (el.classList.contains('on')) el.classList.add('out'); el.classList.remove('on'); }\n      });\n      pipEls.forEach((p, j) => p.classList.toggle('on', j === i));\n      const c = C[i];\n      prim.textContent = c.primary; sec.textContent = c.secondary;\n      dim.style.opacity = DIM[c.key] || 0;\n      moveCam(CAMS[c.key] || CAMS.gym);\n      fxStart(c.key); scrimb.style.opacity = 1;\n    }\n\n    function endState(msg) {\n      ended = true;\n      [cont, prim, sec, fine, linesEl, chEl, pips].forEach(e => { e.style.transition = 'opacity 400ms'; e.style.opacity = 0; e.style.pointerEvents = 'none'; });\n      endEl.textContent = msg; endEl.classList.add('on');\n    }\n\n    closeB.onclick = () => { if (ended) return; GL.done('close'); endState('closed. still going.'); };\n    cont.onclick = () => {\n      if (phase !== 'pause' || GL.clock() < GL.WAIT || ended) return;\n      phase = 'choice'; idx = 0;\n      linesEl.style.transition = 'opacity 350ms'; linesEl.style.opacity = 0;\n      fine.style.opacity = 0; cont.style.transition = 'opacity 250ms'; cont.style.opacity = 0; cont.style.pointerEvents = 'none';\n      prim.style.display = sec.style.display = ''; prim.style.opacity = 0; sec.style.opacity = 0;\n      pips.style.transition = 'opacity 400ms'; pips.style.opacity = 1;\n      requestAnimationFrame(() => { prim.style.transition = sec.style.transition = 'opacity 400ms'; prim.style.opacity = sec.style.opacity = 1; });\n      hap('rigid'); showChoice(0);\n    };\n    sec.onclick = () => {\n      if (phase !== 'choice' || ended) return;\n      idx = (idx + 1) % C.length; hap('rigid'); showChoice(idx);\n    };\n    const END = { gym: 'opens: trip page', home: 'opens: home workout', cant: \"opens: can't today screen\" };\n    prim.onclick = () => {\n      if (phase !== 'choice' || ended) return;\n      const key = C[idx].key; hap('heavy'); GL.done(key); endState(END[key] || ('opens: ' + key));\n    };\n\n    /* frame loop, driven by GL.clock() */\n    function frame(now) {\n      if (myGen !== gen) return;\n      const t = GL.clock();\n\n      entry.style.opacity = clamp(1 - t / 0.6);\n\n      /* sun ine{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:rgba(255,255,255,.55);transition:opacity .3s}\n/* choices */\n.cta{position:absolute;left:28px;right:28px;height:56px;border-radius:28px;background:#fff;color:var(--ink);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center}\n#ch{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}\n#ch.on{opacity:1;pointer-events:auto}\n#chbody{position:absolute;left:28px;right:28px;top:96px;bottom:150px;display:grid;align-items:center}\n.blk{grid-area:1/1;text-align:center;opacity:0;transform:translateY(24px);transition:opacity .42s var(--ease),transform .42s var(--ease);pointer-events:none}\n.blk.in{opacity:1;transform:none}\n.blk.out{opacity:0;transform:translateY(-24px)}\n.cnt{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:14px;font-weight:500}\n.vis{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px}\n.ttl{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.02em}\n.lead{font-size:17px;line-height:1.3;color:rgba(255,255,255,.8);margin-top:10px}\n.perks{margin-top:14px}\n.perk{font-size:15px;line-height:1.35;color:rgba(255,255,255,.7);margin-top:4px;opacity:0;transform:translateY(8px);transition:opacity .3s ease-out,transform .3s ease-out}\n.blk.in .perk{opacity:1;transform:none;transition-delay:calc(200ms + var(--i)*60ms)}\n.blk .fl.tl .ff{opacity:0}\n.blk.in .fl.tl .ff{opacity:1;transition:opacity .6s ease-out .35s}\n.blk.in .fl.tl .fo{opacity:0;transition:opacity .6s ease-out .35s}\n.blk.in .fl.tl{animation:pop .6s ease-out .35s}\n@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}\n.pips{display:flex;align-items:center;gap:6px;margin-top:2px}\n.pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55)}\n.pips i.f{background:#fff;border-color:#fff}\n.pips span{font-size:14px;color:rgba(255,255,255,.6);margin-left:6px;font-weight:500}\n/* calendar */\n.cal{position:relative;width:296px;border:2px solid rgba(255,255,255,.6);border-radius:16px;padding:10px 12px 8px}\n.cal:before,.cal:after{content:\"\";position:absolute;top:-8px;width:2px;height:12px;background:rgba(255,255,255,.8);border-radius:1px}\n.cal:before{left:62px}.cal:after{right:62px}\n.cal .hd,.cal .cells{display:grid;grid-template-columns:repeat(7,38px)}\n.cal .hd span{font-size:13px;font-weight:600;color:rgba(255,255,255,.5);text-align:center}\n.cal .cells{position:relative;height:40px;align-items:center}\n.cal .cells b{justify-self:center;display:block;width:18px;height:18px;border-radius:50%}\n.cal .cells b.done{background:#fff}\n.cal .cells b.rest,.cal .cells b.today{width:5px;height:5px;background:rgba(255,255,255,.2)}\n.cal .cells b.planned{border:1.5px dashed rgba(255,255,255,.65)}\n.cal .mk{position:absolute;left:10px;top:11px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:transparent;transform:translateX(0)}\n.blk.in .cal .mk{transform:translateX(var(--dx));background:#fff;transition:transform .7s var(--ease) .5s,background .3s linear 1.15s}\n#chbody .ic{color:#fff}\n#sec,#pri{transition:opacity .3s}\n#pri{bottom:calc(80px + env(safe-area-inset-bottom))}\n#pri:active{transform:scale(.98)}\n#sec{position:absolute;left:28px;right:28px;bottom:calc(30px + env(safe-area-inset-bottom));height:44px;font-size:16px;font-weight:600;color:rgba(255,255,255,.7)}\n#end{position:absolute;left:28px;right:28px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;color:rgba(255,255,255,.8);opacity:0;transition:opacity .6s var(--ease);pointer-events:none}\n#end.on{opacity:1}\n@media (max-height:700px){\n  .vis{gap:8px}\n  #stage{top:116px;bottom:118px}\n  .bcap{margin-top:20px}\n  .sk .num{font-size:76px}.f66 .num{font-size:64px}.f66{margin-bottom:12px}.big{font-size:62px}\n  .qm{font-size:80px;height:44px}.qt{font-size:28px}\n  .ttl{font-size:30px}.vis{margin-bottom:14px;gap:10px}.lead{font-size:16px}.perk{font-size:14px}\n  #chbody{top:84px;bottom:146px}\n  #timer{bottom:calc(40px + env(safe-area-inset-bottom))}\n}\n@media (prefers-reduced-motion:reduce){\n  .perk{transform:none!important}.blk,.blk.in,.blk.out{transform:none!important}\n  .blk.in .fl.tl{animation:none}.blk.in .cal .mk{transition:none}\n  #timer.shake{animation:none}\n}\n<\/style><\/head>\n<body>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs><linearGradient id=\"fg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#D82713\"/><stop offset=\".5\" stop-color=\"#FF7300\"/><stop offset=\"1\" stop-color=\"#FFC42E\"/><\/linearGradient><\/defs><\/svg>\n<div id=\"app\">\n  <div id=\"media\"><div id=\"kb\"><div class=\"blob\" id=\"b1\"><\/div><div class=\"blob\" id=\"b2\"><\/div><div id=\"horizon\"><\/div><\/div><div id=\"vig\"><\/div><div id=\"shade\"><\/div><div id=\"label\"><\/div><\/div>\n  <div id=\"prog\"><div id=\"fill\"><\/div><\/div>\n  <div id=\"meta\"><\/div>\n  <div id=\"stage\"><\/div>\n  <div id=\"fine\">close to keep going. no wait.<\/div>\n  <button id=\"timer\" aria-label=\"continue, after 30 seconds\"><span id=\"tfill\"><\/span><span id=\"tlab\">0:30<\/span><\/button>\n  <div id=\"ch\"><div id=\"chbody\"><\/div><button id=\"pri\" class=\"cta\"><span id=\"prilab\"><\/span><\/button><button id=\"sec\"><span id=\"seclab\"><\/span><\/button><\/div>\n  <div id=\"end\"><\/div>\n  <button id=\"snd\" aria-label=\"sound\"><i><\/i><\/button>\n  <button id=\"x\" aria-label=\"close, keep going\"><i><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M2 2l10 10M12 2L2 12\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg><\/i><\/button>\n<\/div>\n<script>/* GymLock \u00b7 \"plans changed\" pause \u00b7 shared engine for all 4 variants.\n   Owns: demo scenario, the copy (lines + choices), reading pace, the 30 s clock, demo haptic log.\n   Variants own only the look and motion. Do not edit this file from a variant. */\n(function () {\n  const WAIT = 30;\n\n  /* ---------------- scenario (stands in for real app data) ---------------- */\n  const DEFAULT = {\n    ctx: 'wake',          // 'wake' just woke (window open) | 'trip' on the way | 'closed' window ran out\n    visits: 23,           // gym visits so far (GymVisitTracker); day N of 66 counts these\n    lastMissed: false,    // last planned session was skipped\n    weekDone: 1, weekGoal: 3, plannedLeft: 3, // plannedLeft includes today (SkipRules.chancesRemaining)\n    reason: 'laterToday', // OnboardingProfile.failureReasons first pick, or 'none'\n    gymBy: '7:05', now: '6:41', etaMin: 12, graceMin: 10,\n    homeLeft: 2, homeMin: 25,\n    day0: 'video',        // Day0Media kind: 'video' | 'photo' | 'none'\n    day0Date: 'sep 12',\n    streakWeeks: 6,       // week streak (StreakChip number)\n    alarmAt: '6:30', date: 'tue nov 24'\n  };\n  let cfg = Object.assign({}, DEFAULT);\n\n  /* ---------------- reading pace ----------------\n     Adults read about 238 words a minute silently (Brysbaert, 2019). Just after waking, sleep inertia\n     slows thinking (Hilditch, 2019), so we pace for 150 wpm = 2.5 words a second, plus time to notice\n     the line and a dwell before the next one. */\n  const WPS = 2.5, NOTICE = 0.5, DWELL = 1.1, MIN_LINE = 2.4, START = 0.7;\n  const words = s => s.trim().split(/\\s+/).length;\n  const lineDuration = s => Math.max(MIN_LINE, NOTICE + words(s) / WPS + DWELL);\n\n  /* ---------------- the copy ---------------- */\n  const OWN = {\n    laterToday: '\"i tell myself i\\'ll go later.\"',\n    scrolling: '\"i start scrolling.\"',\n    exhausted: '\"i\\'m exhausted.\"',\n    scheduleChanges: '\"my schedule changes.\"'\n  };\n  const OWN_AFTER = {\n    laterToday: 'this is that sentence, happening.',\n    scrolling: 'skip, and the apps open. that is the trade.',\n    exhausted: '10 easy minutes lifts energy. today can be a light one.',\n    scheduleChanges: (c) => `if it really did, ${c.homeMin} minutes at home still counts.`\n  };\n  function stage(c) {\n    if (c.visits < 10) return 'new';\n    if (c.visits < 40) return 'building';\n    if (c.visits < 66) return 'close';\n    return 'habit';\n  }\n  function weekReachableWithoutToday(c) { return c.weekDone + (c.plannedLeft - 1) >= c.weekGoal; }\n\n  /* Returns the lines for the 30 s, in order, each with its start time and duration.\n     kind: 'ground' | 'own' | 'quote' | 'stake' | 'fact' | 'close'. A fact carries src. */\n  function lines(c = cfg) {\n    const L = [];\n    const add = (p, kind, text, extra) => L.push(Object.assign({ p, kind, text }, extra || {}));\n\n    // 1. where you are right now\n    if (c.ctx === 'wake') add(1, 'ground', 'you beat the alarm. the rest is shoes and a door.');\n    if (c.ctx === 'trip') add(1, 'ground', `you're ${c.etaMin} minutes from the gym.`);\n    if (c.ctx === 'closed') add(1, 'ground', `gym time was ${c.gymBy}. it is ${c.now} now.`);\n\n    // 2. their own words from day 0\n    if (OWN[c.reason]) {\n      add(2, 'own', 'on day 0 you told us why you miss:');\n      add(2, 'quote', OWN[c.reason]);\n      const after = OWN_AFTER[c.reason];\n      add(2, 'own', typeof after === 'function' ? after(c) : after);\n    }\n\n    // 3. the stakes, from real numbers\n    if (c.lastMissed) add(3, 'stake', 'last time was a skip too. two in a row is where habits slip.');\n    else if (!weekReachableWithoutToday(c)) add(3, 'stake', `skip today and ${c.weekGoal} this week is out of reach.`);\n    else add(6, 'stake', `today would make it ${c.weekDone + 1} of ${c.weekGoal} this week.`);\n\n    // 4. one concrete fact for where they are in the habit\n    const s = stage(c);\n    if (s === 'new') add(4, 'fact', 'people expect a workout to feel worse than it does. they only picture the first minutes.', { src: 'ruby et al., 2011' });\n    if (s === 'building') add(4, 'fact', `every visit makes the next one take less effort. you have ${c.visits} behind you.`, { src: 'lally et al., 2010' });\n    if (s === 'close') add(4, 'fact', `${66 - c.visits} more visits and going stops being a decision.`, { src: 'lally et al., 2010' });\n    if (s === 'habit') add(4, 'fact', `${c.visits} visits. one more keeps it automatic.`, { src: 'lally et al., 2010' });\n\n    // 5. the way forward\n    if (c.ctx === 'closed') add(5, 'close', `go now and you get ${c.graceMin} more minutes.`);\n    else add(5, 'close', `gym by ${c.gymBy}. you can still make it.`);\n\n    // fit into 30 s by reading pace: drop the lowest priority until it fits\n    let fitted = L.slice();\n    const total = arr => START + arr.reduce((a, l) => a + lineDuration(l.text), 0);\n    while (total(fitted) > WAIT - 0.4 && fitted.length > 1) {\n      const worst = fitted.reduce((w, l) => (l.p > w.p ? l : w), fitted[0]);\n      // own words travel as a block of three: drop the whole block or none\n      fitted = worst.p === 2 ? fitted.filter(l => l.p !== 2) : fitted.filter(l => l !== worst);\n    }\n    let t = START;\n    return fitted.map(l => { const d = lineDuration(l.text); const o = Object.assign({}, l, { t, d, words: words(l.text) }); t += d; return o; });\n  }\n\n  /* ---------------- the three choices, in order ---------------- */\n  function choices(c = cfg) {\n    const list = [];\n    list.push({\n      key: 'gym', title: 'still going', icon: 'shoe',\n      lead: c.ctx === 'closed' ? `${c.graceMin} more minutes. not a new window.` : `gym by ${c.gymBy}.`,\n      perks: [`visit ${c.visits + 1} of 66`, `this week becomes ${c.weekDone + 1} of ${c.weekGoal}`, 'apps unlock when you arrive'],\n      primary: \"i'm going\", secondary: 'not this'\n    });\n    if (c.homeLeft > 0) list.push({\n      key: 'home', title: 'quick workout instead', icon: 'house',\n      lead: `${c.homeMin} minutes at home counts as a full day.`,\n      perks: [`this week becomes ${c.weekDone + 1} of ${c.weekGoal}` .8,.8)));\n    const dp=prog(lt,2.5,.2);dot.setAttribute('opacity',dp);\n    const pz=RM||lt<2.5?0:((lt-2.5)%1.4)/1.4;ring.setAttribute('r',5+8*pz);ring.setAttribute('opacity',dp*(1-pz)*.6);\n    b.cap.style.opacity=prog(lt,1.9,.4);\n  };\n  return b;\n}\n\nfunction bOwn(Ls){\n  const q=Ls.find(l=>l.kind==='quote');\n  const b=mkBeat('own',Ls.map(l=>l.text).join(' '));\n  const txt=q.text.replace(/^[\"\u201c]|[\"\u201d]$/g,'');\n  b.el.innerHTML='<div class=\"qlab\">you, on day 0<\/div><div class=\"qm\" aria-hidden=\"true\">\u201c<\/div><div class=\"qt\"><\/div><div class=\"qm qm2\" aria-hidden=\"true\" style=\"height:30px;line-height:.9\">\u201d<\/div>';\n  const qt=b.el.querySelector('.qt');\n  const ws=txt.split(/\\s+/).map((w,k,a)=>{const s=document.createElement('span');s.className='w';s.textContent=w;qt.appendChild(s);if(k<a.length-1)qt.appendChild(document.createTextNode(' '));return s});\n  const lab=b.el.querySelector('.qlab'),m1=b.el.children[1],m2=b.el.children[3];\n  m2.style.opacity=0;\n  b.update=lt=>{\n    lab.style.opacity=prog(lt,.1,.4);\n    m1.style.opacity=prog(lt,.1,.5);m1.style.transform=RM?'none':'scale('+(.85+.15*ease(prog(lt,.1,.5)))+')';\n    ws.forEach((w,i)=>{const p=prog(lt,.45+i*.14,.3);w.style.opacity=p;w.style.transform=RM?'none':'translateY('+(1-ease(p))*6+'px)'});\n    m2.style.opacity=prog(lt,.45+ws.length*.14,.4);\n  };\n  return b;\n}\n\nfunction bStake(L){\n  const c=GL.cfg,b0=c.weekDone+c.plannedLeft-1<c.weekGoal;\n  const weak=c.lastMissed||b0;\n  const capT=c.lastMissed?'two in a row cools it.':b0?'skip and the week is out.':'today keeps the flame.';\n  const wk=c.streakWeeks===1?'week':'weeks';\n  const b=mkBeat('stake',(L?L.text:capT)+' '+c.streakWeeks+' '+wk+' streak.');\n  const sk=document.createElement('div');sk.className='sk';\n  const big=flame(84,98,true);\n  const nb=document.createElement('div');nb.innerHTML='<div class=\"num rnd\">'+c.streakWeeks+'<\/div><div class=\"unit\">'+wk+'<\/div>';\n  sk.appendChild(big);sk.appendChild(nb);b.el.appendChild(sk);\n  const row=weekRow(34,40,26,{label:1});row.style.marginTop='34px';b.el.appendChild(row);\n  const today=row.todayFl;\n  capEl(b,capT);\n  b.update=lt=>{\n    // big flame weakens for a second, then recovers\n    let w=0;if(weak)w=RM?.7:prog(lt,.5,.4)*(1-prog(lt,1.8,.7));\n    big.style.transform='scale('+(1-.08*w)+')';\n    big.style.filter='saturate('+(1-.4*w)+')';\n    // today flame flickers toward lit, then falls back\n    if(today){\n      const env=Math.sin(Math.PI*prog(lt,.6,1.3));\n      const nz=RM?1:(.62+.38*Math.abs(Math.sin(lt*31)*Math.sin(lt*17+1)));\n      setLit(today,clamp(env*.85*nz,0,1));\n      fire(b,'l',lt,1.05,'light');\n      const br=lt>1.9?(Math.sin((lt-1.9)*2.6)+1)/2:0;\n      today.style.transform=RM?'none':'scale('+(1+.05*br)+')';\n      today.style.opacity=lt>1.9?.65+.35*br:1;\n    }\n    b.cap.style.opacity=prog(lt,.9,.4);\n  };\n  return b;\n}\n\nfunction bFact(L){\n  const c=GL.cfg,st=GL.stage(c),v=c.visits;\n  const capT={new:'the first minutes are the worst.',building:'each visit gets easier.',close:(66-v)+' more and it\u2019s automatic.',habit:'one more keeps it automatic.'}[st];\n  const srcT=L&&L.src?L.src:(st==='new'?'ruby et al., 2011':'lally et al., 2010');\n  const b=mkBeat('fact',L?L.text:capT);\n  const h=document.createElement('div');h.className='f66';\n  h.innerHTML='<span class=\"num rnd\">'+(st==='habit'?v:v+1)+'<\/span><span class=\"of\">'+(st==='habit'?'visits':'of 66')+'<\/span>';\n  b.el.appendChild(h);\n  const g=document.createElement('div');g.className='dots';g.setAttribute('aria-hidden','true');\n  const ds=[];for(let i=0;i<66;i++){const d=document.createElement('i');if(i===v&&v<66)d.className='nx';g.appendChild(d);ds.push(d)}\n  b.el.appendChild(g);capEl(b,capT,srcT);\n  const step=Math.min(.03,1.1/Math.max(1,v));\n  b.update=lt=>{\n    for(let i=0;i<Math.min(v,66);i++){const p=prog(lt,.3+i*step,.2);ds[i].style.background='rgba(255,255,255,'+(.16+.84*p)+')'}\n    const nx=ds[v];if(nx&&v<66){const a=prog(lt,.3+v*step+.2,.3);nx.style.opacity=a;const pp=RM?0:Math.sin(Math.PI*prog(lt,1.7,.9));nx.style.transform='scale('+(1+.55*pp)+')'}\n    b.cap.style.opacity=prog(lt,1.0,.4);if(b.src)b.src.style.opacity=prog(lt,1.5,.4);\n  };\n  return b;\n}\n\nfunction bClose(L){\n  const c=GL.cfg,closed=c.ctx==='closed';\n  const b=mkBeat('close',L.text);\n  b.el.innerHTML='<div class=\"ic\" style=\"color:#fff\">'+ic('dumbbell',56)+'<\/div>'+\n   (closed?'<div class=\"big rnd\">+'+c.graceMin+'<\/div><div class=\"bigl\">min<\/div>':'<div class=\"bigl\" style=\"margin-top:20px\">gym by<\/div><div class=\"big rnd\" style=\"margin-top:6px\">'+esc(c.gymBy)+'<\/div>');\n  capEl(b,closed?'if you go now.':'you can still make it.');\n  const kids=[b.el.children[0],b.el.children[1],b.el.children[2]];\n  b.update=lt=>{kids.forEach((k,i)=>{k.style.opacity=prog(lt,i*.2,.4)});b.cap.style.opacity=prog(lt,.9,.4)};\n  return b;\n}\n\nfunction mkBeats(){\n  const L=GL.lines(),by=k=>L.find(l=>l.kind===k);\n  const g=by('ground'),q=by('quote'),st=by('stake'),f=by('fact'),cl=by('close');\n  const B=[];\n  if(g){const b=bGround(g);b.start=g.t;B.push(b)}\n  if(q){const b=bOwn(L.filter(l=>l.kind==='own'||l.kind==='quote'));b.start=q.t;B.push(b)}\n  // stake: always shown, even when its line was dropped to fit 30 s. Quote keeps >= 4.5 s; the next beat gives way.\n  {\n    let fb=null,cb=null;\n    if(f){fb=bFact(f);fb.start=f.t}\n    if(cl){cb=bClose(cl);cb.start=cl.t}\n    const nxt=fb||cb;\n    const prev=B.length?B[B.length-1]:null;let s;\n    if(st)s=st.t;\n    else{\n      const need=prev?(prev.id==='own'?4.5:3.2):0;\n      s=Math.max((prev?prev.start:0)+need,(nxt?nxt.start:GL.WAIT-3)-4);\n    }\n    const b=bStake(st);b.start=s;B.push(b);\n    if(nxt&&nxt.start<s+3.2)nxt.start=s+3.2;\n    if(fb&&cb&&cb.start<fb.start+2.5)cb.start=fb.start+2.5;\n    if(fb)B.push(fb);if(cb)B.push(cb);\n  }\n  B.sort((a,b)=>a.start-b.start);\n  return B;\n}\n\n/* ---------- build ---------- */\nfunction build(){\n  const cfg=GL.cfg,mode=cfg.day0;\n  S={mode,phase:'play',cur:-2,idx:0,chs:GL.choices(),frozen:false,busy:false};\n  $('stage').innerHTML='';S.B=mkBeats();\n  $('stage').classList.remove('hide');$('media').classList.remove('dark');\n  ['prog','meta','snd','fine','timer'].forEach(i=>$(i).classList.remove('hide'));\n  $('timer').classList.remove('ready');$('tlab').textContent=GL.timerLabel(0);$('tfill').style.transform='scaleX(0)';\n  $('ch').classList.remove('on');$('end').classList.remove('on');$('end').textContent='';\n  $('chbody').innerHTML='';$('fill').style.transform='scaleX(0)';\n  const has=mode==='video'||mode==='photo';\n  $('media').style.display=has?'':'none';\n  $('meta').style.display=has?'':'none';\n  $('meta').textContent='you, on day 0 \u00b7 '+cfg.day0Date;\n  $('snd').style.display=mode==='video'?'':'none';\n  S.muted=true;$('snd').firstChild.innerHTML=MUTE;\n  $('horizon').style.display=mode==='photo'?'block':'none';\n  $('label').style.opacity=1;$('label').textContent=mode==='video'?'your day 0 video plays here':'your day 0 photo';\n}\n\nfunction frame(){\n  requestAnimationFrame(frame);\n  if(!S||S.phase==='end'||S.phase==='choices')return;\n  const now=GL.clock(),t=Math.min(now,GL.WAIT);\n  if(S.phase==='play'){\n    $('fill').style.transform='scaleX('+(t/GL.WAIT)+')';\n    $('tfill').style.transform='scaleX('+(t/GL.WAIT)+')';\n    $('tlab').textContent=GL.timerLabel(now);\n    if(S.mode!=='none'){\n      const m=RM?0:1;\n      if(S.mode==='video'){\n        $('b1').style.transform='translate('+(Math.sin(t*.23)*90*m-60)+'px,'+(Math.cos(t*.17)*70*m-120)+'px) scale('+(1+Math.sin(t*.11)*.08*m)+')';\n        $('b2').style.transform='translate('+(Math.cos(t*.19+1)*100*m+80)+'px,'+(Math.sin(t*.13+2)*80*m+150)+'px) scale('+(1+Math.cos(t*.09)*.08*m)+')';\n        $('kb').style.transform='none';\n      }else{\n        $('b1').style.transform='translate(-50px,-110px)';$('b2').style.transform='translate(70px,140px)';\n        $('kb').style.transform='scale('+(1+(RM?0:.08*t/GL.WAIT))+')';\n      }\n    }\n  }\n  const B=S.B;let cur=-1;$('label').style.opacity=(B.length&&now>=B[0].start)?0:1;B.forEach((b,i)=>{if(now>=b.start)cur=i});\n  if(cur!==S.cur){S.cur=cur;if(cur>=0)GL.hap('soft')}\n  B.forEach((b,i)=>{\n    let o=0,tf='';\n    if(i===cur){const lt=now-b.start,p=ease(clamp(lt/.36,0,1));o=p;tf=RM?'':'translateY('+(10*(1-p))+'px)';b.update(lt)}\n    else if(i<cur){const po=clamp((now-B[i+1].start)/.24,0,1);o=1-po;tf=RM?'':'scale('+(1-.04*po)+')';if(po<1)b.update(B[i+1].start-b.start)}\n    b.el.style.opacity=o;b.el.style.transform=tf;b.el.style.visibility=o>0?'visible':'hidden';\n  });\n  if(S.phase==='play'&&now>=GL.WAIT)freeze();\n}\nfunction freeze(){\n  if(S.frozen)return;S.frozen=true;S.phase='wait';\n  $('fill').style.transform='scaleX(1)';$('tfill').style.transform='scaleX(1)';$('tlab').textContent='continue';\n  $('media').classList.add('dark');$('fine').classList.add('hide');\n  $('timer').classList.add('ready');\n  GL.hap('medium');\n}\n$('timer').addEventListener('click',()=>{\n  if(S.phase==='play'){const t=$('timer');t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');return}\n  if(S.phase!=='wait')return;\n  S.phase='choices';\n  $('timer').classList.add('hide');$('stage').classList.add('hide');\n  ['prog','meta','snd'].forEach(i=>$(i).classList.add('hide'));\n  const n=S.chs.length;\n  S.chs.forEach((c,i)=>{\n    const b=document.createElement('div');b.className='blk';\n    const keep={gym:[0,2],home:[1],cant:[0,1]}[c.key]||[0,1];\n    const pk=keep.map(k=>c.perks[k]).filter(Boolean);\n    b.innerHTML='<div class=\"cnt\">'+(i+1)+' of '+n+'<\/div><div class=\"vis\"><\/div><div class=\"ttl\">'+esc(c.title)+'<\/div><div class=\"lead\">'+esc(c.lead)+'<\/div><div class=\"perks\">'+pk.map((p,k)=>'<div class=\"perk\" style=\"--i:'+k+'\">'+esc(p)+'<\/div>').join('')+'<\/div>';\n    visual(b.querySelector('.vis'),c);\n    $('chbody').appendChild(b);c.el=b;\n  });\n  S.idx=0;setBtns(0);$('ch').classList.add('on');\n  requestAnimationFrame(()=>{S.chs[0].el.classList.add('in');lightHap(S.chs[0])});\n});\nfunction visual(v,c){\n  const g=GL.cfg;\n  if(c.key==='gym'){\n    v.innerHTML=ic('dumbbell',68);\n    v.appendChild(weekRow(40,47,28,{today:'tl'}));\n  }else if(c.key==='home'){\n    v.innerHTML=ic('house',68);\n    v.appendChild(weekRow(40,47,28,{today:'tl'}));\n    const p=document.createElement('div');p.className='pips';\n    let h='';for(let k=0;k<3;k++)h+='<i class=\"'+(k<g.homeLeft?'f':'')+'\"><\/i>';\n    p.innerHTML=h+'<span>'+g.homeLeft+' of 3 left this month<\/span>';v.appendChild(p);\n  }else{\n    const wk=GL.week();let ti=wk.findIndex(d=>d.state==='today');\n    let to=wk.findIndex((d,i)=>i>ti&&d.state==='planned');if(to<0)to=Math.min(6,ti+1);\n    const cal=document.createElement('div');cal.className='cal';\n    cal.setAttribute('aria-hidden','true');\n    cal.innerHTML='<div class=\"hd\">'+wk.map(d=>'<span>'+d.n+'<\/span>').join('')+'<\/div><div class=\"cells\">'+wk.map(d=>'<b class=\"'+d.state+'\"><\/b>').join('')+'<i class=\"mk\" style=\"left:'+(10+ti*38)+'px;--dx:'+((to-ti)*38)+'px\"><\/i><\/div>';\n    v.appendChild(cal);\n    v.appendChild(weekRow(36,42,26,{}));\n  }\n}\nfunction lightHap(c){if(c.key==='cant')return;setTimeout(()=>{if(S.phase==='choices'&&S.chs[S.idx]===c)GL.hap('light')},650)}\nfunction setBtns(i,anim){\n  const c=S.chs[i];$('prilab').textContent=c.primary;$('seclab').textContent=c.secondary;\n  if(anim&&!RM)[$('prilab'),$('seclab')].forEach(e=>e.animate([{opacity:0},{opacity:1}],{duration:320,easing:'ease-out'}));\n}\n$('sec').addEventListener('click',()=>{\n  if(S.phase!=='choices')return;\n  const from=S.chs[S.idx];S.idx=(S.idx+1)%S.chs.length;const to=S.chs[S.idx];\n  GL.hap('rigid');\n  from.el.classList.remove('in');from.el.classList.add('out');\n  to.el.style.transition='none';to.el.classList.remove('out');to.el.style.opacity=0;to.el.style.transform=RM?'none':'translateY(24px)';\n  void to.el.offsetWidth;to.el.style.transition='';to.el.style.opacity='';to.el.style.transform='';\n  to.el.classList.add('in');lightHap(to);\n  setTimeout(()=>{from.el.classList.remove('out')},450);\n  setBtns(S.idx,true);\n});\n$('pri').addEventListener('click',()=>{\n  if(S.phase!=='choices')return;\n  const c=S.chs[S.idx];GL.hap('heavy');GL.done(c.key);\n  finish({gym:'opens: trip page',home:'opens: home workout',cant:\"opens: can't today screen\"}[c.key]||'');\n});\n$('x').addEventListener('click',()=>{if(S.phase==='end')return;GL.done('close');finish('closed. still going.')});\n$('snd').addEventListener('click',()=>{S.muted=!S.muted;$('snd').firstChild.innerHTML=S.muted?MUTE:LOUD});\nfunction finish(txt){\n  S.phase='end';\n  ['stage','fine','prog','meta','snd','timer'].forEach(i=>$(i).classList.add('hide'));\n  $('ch').classList.remove('on');$('media').classList.add('dark');\n  $('end').textContent=txt;requestAnimationFrame(()=>$('end').classList.add('on'));\n}\nwindow.__d0=()=>S.B.map(b=>[b.id,b.start]);\nGL.onRestart(build);\nbuild();requestAnimationFrame(frame);\n})();\n<\/script>\n<\/body><\/html>\n"};
const f = document.getElementById('f'), phone = document.getElementById('phone');
let v = 'mprinter';
function fit(){ f.style.transform = `scale(${phone.clientWidth/390})`; }
addEventListener('resize', fit);
function cfg(){
  const g = id => document.getElementById(id).value;
  const ctx = g('ctx');
  const risk = g('week') === 'risk';
  return { ctx, visits:+g('visits'), reason:g('reason'), lastMissed:g('lastMissed')==='1',
    weekDone:1, weekGoal:3, plannedLeft: risk ? 2 : 3, homeLeft:+g('homeLeft'), day0:g('day0'),
    now: ctx==='closed' ? '7:09' : '6:41' };
}
function load(){ f.onload = () => f.contentWindow.postMessage({gl:'config', cfg:cfg()}, '*'); f.srcdoc = SRC[v]; fit(); }
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#seg button').forEach(x => x.classList.remove('on')); b.classList.add('on'); v = b.dataset.v; load();
});
document.querySelectorAll('select').forEach(s => s.onchange = load);
document.getElementById('skip').onclick = () => f.contentWindow.postMessage({gl:'skip'}, '*');
document.getElementById('restart').onclick = load;
const hd = document.getElementById('hd'), hl = document.getElementById('hl');
addEventListener('message', e => {
  const m = e.data || {};
  if (m.gl === 'hap'){ hd.classList.add('go'); hl.textContent = 'haptic: ' + m.kind; setTimeout(()=>hd.classList.remove('go'), 120); }
  if (m.gl === 'done'){ hl.textContent = 'chose: ' + m.what; }
});
load();
</script>

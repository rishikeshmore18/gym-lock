name: iOS build check
on:
  push:
  workflow_dispatch:
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build GymLock (no signing)
        working-directory: ios-gymlock
        run: |
          set -o pipefail
          xcodebuild build \
            -project GymLock.xcodeproj \
            -scheme GymLock \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ../build.log | tail -n 200
      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
